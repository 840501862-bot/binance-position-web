<!DOCTYPE html>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231b4fa0'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='%23ffffff' font-family='Arial' font-weight='bold'%3EBN%3C/text%3E%3C/svg%3E">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Microsoft YaHei UI", "PingFang SC", "Segoe UI", sans-serif;

  header {

  .toolbar {

  button.primary:hover { background: linear-gradient(180deg, #2f8cff, #1e6ef0); color: #fff; }
  button.danger { background: #d92b45; border-color: #ff4d6d; color: #fff; }

  main { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
  .table-wrap { flex: 1; overflow: auto; position: relative; background: #0c1e3e; }
  table { border-collapse: collapse; width: 100%; min-width: 1750px; }
  thead th {
    position: sticky; top: 0; z-index: 2;

  thead th.acct-head { text-align: center; color: #c9ddf5; border-left: 2px solid #0c1e3e; }
  thead th.acct-head .tag { display: inline-block; font-size: 11px; font-weight: 400;
    border-radius: 3px; padding: 0 5px; margin-left: 4px; }
  .tag.ok { background: rgba(61,220,151,.15); color: #3ddc97; }
  .tag.err { background: rgba(255,84,112,.16); color: #ff5470; }
  .tag.na  { background: rgba(125,147,171,.15); color: #7d93ab; }
  tbody td { border-bottom: 1px solid #2E6FBF; padding: 8px 6px; white-space: nowrap; }
  tbody tr.stripe-0 { background: #3A7BD5; }
  tbody tr.stripe-1 { background: #4B8EDD; }

  /* 不同币种之间的空行分隔（与桌面版一致） */

  tbody tr.coin-row td { padding-top: 5px; padding-bottom: 5px; }

  /* 账户之间的分隔：每个账户第一个块（USDT）左侧画一条竖线 */
  td.sym.acct-first { border-left: 2px solid #0c1e3e; }
  /* 方向列：多单 / 空单（横向滚动时固定在左侧） */
  thead th.dir-head, tbody td.dir {

<script>
"use strict";

// ==================== 常量与数据 ====================
const FAPI = "https://fapi.binance.com";            // USDⓈ-M 合约
const MAX_ACCOUNT_COUNT = 20;                       // 账户数不固定，仅作上限保护
const KEY_STORE = "bf_keys_v1";                     // localStorage 键名
const SL_STORE = "bf_sl_orders_v1";                 // 本地止损单跟踪
// 37 个基础币种（按交易对文件顺序，每组 USDT 在上、USDC 在下）
const BASES = ["NEO","ETHFI","1000BONK","ORDI","KAITO","BIO","WLFI","PNUT","BCH","BOME",
  "LTC","PENGU","CRV","TRUMP","HBAR","1000SHIB","WIF","UNI","SUI","WLD",
  "AVAX","1000PEPE","ARB","LINK","AAVE","ADA","SOL","ZEC","XRP","NEAR",
  "BNB","ENA","FIL","DOGE","TIA","TRX","HYPE"];
const ALL_PAIRS = [];
BASES.forEach(b => { ALL_PAIRS.push(b + "USDT", b + "USDC"); });
const MAX_COINS_PER_GROUP = 13;   // 37 币按 13/13/11 分为 3 组

function buildPairGroups() {
  const n = Math.max(1, Math.ceil(BASES.length / MAX_COINS_PER_GROUP));
  const groups = [];
  for (let gi = 0; gi < n; gi++) {
    const chunk = BASES.slice(gi * MAX_COINS_PER_GROUP, (gi + 1) * MAX_COINS_PER_GROUP);
    const syms = [];
    chunk.forEach(b => { syms.push(b + "USDT", b + "USDC"); });
    groups.push({label: "第" + (gi + 1) + "组 " + chunk.length + "币 " + syms.length + "对", pairs: syms});
  }
  return groups;
}

// ==================== 全局状态 ====================
const state = {
  groups: buildPairGroups(),
  groupPairs: new Set(),
  data: null,
  configured: {},
  fetching: false,
  onlyAction: true,   // 只看需要动作的币（同币的 USDT/USDC、多/空、所有账户视为一个整体）
};
const $ = id => document.getElementById(id);

// ==================== 密钥管理（仅存本浏览器） ====================
// 内存缓存：避免每次渲染都 JSON.parse 一遍 localStorage（表格按账户 × 交易对循环时调用很频繁）
let keysCache = null;
function loadKeys() {
  if (keysCache) return keysCache;
  try { keysCache = JSON.parse(localStorage.getItem(KEY_STORE) || "{}") || {}; }
  catch (e) { keysCache = {}; }
  return keysCache;
}
function saveKeys(keys) { keysCache = keys; localStorage.setItem(KEY_STORE, JSON.stringify(keys)); }
function keysFor(i) {
  const k = loadKeys()[i] || {};
  return {key: (k.key || "").trim(), secret: (k.secret || "").trim(), is5x: !!k.is5x};
}
/* 账户数不固定：以"填了 key 或 secret"的槽位为准，至少留 1 个空位供填写 */
function accountList() {
  const keys = loadKeys();
  const idxs = Object.keys(keys)
    .filter(k => /^\d+$/.test(k) && keys[k] && ((keys[k].key || "").trim() || (keys[k].secret || "").trim()))
    .map(Number).sort((a, b) => a - b);
  return idxs.length ? idxs : [0];
}
/* 显示名按"第几个账户"连续编号（删掉中间账户后不会出现账户3、账户5 的断号） */
function accountName(i) {
  const pos = accountList().indexOf(i);
  return "账户" + ((pos < 0 ? i : pos) + 1);
}

/* 5倍杠杆账户 ROI 等比缩放：实际 7.5% = 正常 100% */
const LEV5_SCALE = 100/7.5;
function scaleRoi(is5x, roi){ return is5x ? roi*LEV5_SCALE : roi; }

// 本地止损单跟踪：{account, symbol, positionSide, clientAlgoId, triggerPrice, created}
function loadTracking() {
  try { const d = JSON.parse(localStorage.getItem(SL_STORE) || "[]"); return Array.isArray(d) ? d : []; }
  catch (e) { return []; }
}
function saveTracking(orders) { localStorage.setItem(SL_STORE, JSON.stringify(orders)); }

// ==================== 工具 ====================
function esc(s) {
  return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function toFloat(v, dflt) { const n = parseFloat(v); return isFinite(n) ? n : (dflt || 0); }
function fmtMoney(v) {
  if (v == null || !isFinite(v) || v <= 0) return "";
  return v.toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});
}
function fmtRoi(v) {
  if (v == null || !isFinite(v)) return "";
  return (v > 0 ? "+" : "") + v.toFixed(2) + "%";
}
function roiClass(v) {
  if (v == null || !isFinite(v) || v === 0) return "";
  return v > 0 ? "pos-up" : "pos-dn";
}
function showInfo(title, body) {
  $("infoTitle").textContent = title;
  $("infoBody").textContent = body;
  $("infoMask").classList.add("show");
}
function hide(el) { el.classList.remove("show"); }

// ==================== 币安客户端（浏览器直连） ====================
// 服务器时间同步（60 秒内不重复；performance.now() 做单调时钟）
let serverRefMs = 0, serverRefPerf = 0, syncOk = false;
async function ensureOffset() {
  if (syncOk && performance.now() - serverRefPerf < 60000) return;
  const urls = [FAPI + "/fapi/v1/time", "https://api.binance.com/api/v3/time"];
  for (const url of urls) {
    try {
      const r = await fetch(url, {method: "GET"});
      const d = await r.json();
      const ms = toFloat(d.serverTime);
      if (ms > 0) { serverRefMs = ms; serverRefPerf = performance.now(); syncOk = true; return; }
    } catch (e) { /* 换下一个时间源 */ }
  }
  syncOk = false; // 两个都失败：保持旧基准，下次请求前再同步
}
async function forceResync() { syncOk = false; await ensureOffset(); }
async function nowMs() {
  await ensureOffset();
  if (serverRefMs > 0) return Math.round(serverRefMs + (performance.now() - serverRefPerf));
  return Date.now();
}

// HMAC-SHA256 签名（crypto.subtle，需 https/localhost 安全上下文）
async function hexSign(secret, msg) {
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey("raw", enc.encode(secret),
    {name: "HMAC", hash: "SHA-256"}, false, ["sign"]);
  const sig = await crypto.subtle.sign("HMAC", key, enc.encode(msg));
  return Array.from(new Uint8Array(sig)).map(b => b.toString(16).padStart(2, "0")).join("");
}

// 统一请求：public 不带签名；signed 带 X-MBX-APIKEY + signature，遇 -1021 重同步重试一次
async function bfRequest(path, method, params, key, secret, retry1021) {
  if (retry1021 === undefined) retry1021 = true;
  const q = new URLSearchParams();
  if (params) { for (const [k, v] of Object.entries(params)) { if (v !== undefined && v !== null) q.append(k, v); } }
  let url = FAPI + path;
  let headers = {};
  if (key && secret) {
    q.append("timestamp", String(await nowMs()));
    q.append("recvWindow", "10000");
    const query = q.toString();
    headers["X-MBX-APIKEY"] = key;
    url = FAPI + path + "?" + query + "&signature=" + await hexSign(secret, query);
  } else if (q.toString()) {
    url = FAPI + path + "?" + q.toString();
  }
  const resp = await fetch(url, {method, headers});
  let data;
  try { data = await resp.json(); } catch (e) { data = null; }
  if (resp.status !== 200) {
    if (data && data.code === -1021 && retry1021) {
      await forceResync();
      return bfRequest(path, method, params, key, secret, false);
    }
    const msg = (data && data.code !== undefined)
      ? "code " + data.code + "：" + (data.msg || "无错误说明（HTTP " + resp.status + "）")
      : "HTTP " + resp.status;
    throw new Error(path + " 失败：" + msg);
  }
  if (data && typeof data === "object" && data.code !== undefined && data.code !== null
      && String(data.code) !== "200") {
    if (data.code === -1021 && retry1021) {
      await forceResync();
      return bfRequest(path, method, params, key, secret, false);
    }
    throw new Error(path + " 失败（code " + data.code + "）：" + (data.msg || "无说明"));
  }
  return data;
}
const bfPublic = (path, params) => bfRequest(path, "GET", params, null, null, false);
const bfSigned = (method, path, params, key, secret) => bfRequest(path, method, params, key, secret);

// ==================== 交易规则（exchangeInfo 缓存） ====================
let exInfo = null, exFilters = null;
async function ensureEx() {
  if (exInfo) return;
  const data = await bfPublic("/fapi/v1/exchangeInfo");
  exInfo = {};
  exFilters = {};
  (data.symbols || []).forEach(s => {
    exInfo[s.symbol] = [toFloat(s.quantityPrecision, 4), toFloat(s.pricePrecision, 4)];
    let minNotional = 0, step = 0;
    (s.filters || []).forEach(f => {
      if (f.filterType === "MIN_NOTIONAL") minNotional = toFloat(f.notional);
      else if (f.filterType === "LOT_SIZE") step = toFloat(f.stepSize);
    });
    exFilters[s.symbol] = {minNotional, stepSize: step};
  });
}
const qtyPrec = async s => { await ensureEx(); return (exInfo[s] || [4, 4])[0]; };
const minNotional = async s => { await ensureEx(); return (exFilters[s] || {}).minNotional || 0; };
const lotStep = async s => { await ensureEx(); return (exFilters[s] || {}).stepSize || 0; };
async function markPrice(symbol) {
  const d = await bfPublic("/fapi/v1/premiumIndex", {symbol});
  return toFloat(d.markPrice);
}

// ==================== 持仓与计算（与桌面版一致） ====================
async function fetchPositions(key, secret, symbol) {
  return bfSigned("GET", "/fapi/v2/positionRisk", symbol ? {symbol} : {}, key, secret);
}
const dualCache = new Map(); // api_key -> 是否双向持仓
// 持仓模式以 /fapi/v1/positionSide/dual 为准（/fapi/v2/account 不返回该字段）
async function getDualSide(key, secret) {
  if (!dualCache.has(key)) {
    let dual = false;
    try {
      const d = await bfSigned("GET", "/fapi/v1/positionSide/dual", {}, key, secret);
      const v = d && d.dualSidePosition;
      dual = (v === true || v === "true");
    } catch (e) { /* 接口不可用时退回账户信息 */ }
    if (!dual) {
      try {
        const d2 = await bfSigned("GET", "/fapi/v2/account", {}, key, secret);
        if (d2 && d2.dualSidePosition === true) dual = true;
      } catch (e) { /* 两个都失败才用 false */ }
    }
    dualCache.set(key, dual);
  }
  return dualCache.get(key);
}
function positionMargin(pos) {
  const margin = toFloat(pos.positionInitialMargin || pos.isolatedMargin || pos.initialMargin);
  if (margin > 0) return margin;
  const notional = Math.abs(toFloat(pos.notional));
  const lev = toFloat(pos.leverage);
  if (lev > 0 && notional > 0) return notional / lev;
  return 0;
}
function positionRoi(pos) {
  const unrealized = toFloat(pos.unRealizedProfit);
  const margin = positionMargin(pos);
  if (margin <= 0) return 0;
  return unrealized / margin * 100;
}
// 只统计多单：positionAmt>0 的行合并成一行
// 只统计空单：positionAmt<0 的行合并成一行（side 传 "SHORT"）
function computePosition(symbol, rows, side) {
  const short = side === "SHORT";
  let totalNotional = 0, totalUnrealized = 0, totalMargin = 0;
  (rows || []).forEach(pos => {
    const amt = toFloat(pos.positionAmt);
    if (short ? amt >= 0 : amt <= 0) return;
    const mark = toFloat(pos.markPrice);
    totalNotional += Math.abs(amt) * mark;
    totalUnrealized += toFloat(pos.unRealizedProfit);
    totalMargin += positionMargin(pos);
  });
  const roi = totalMargin > 0 ? totalUnrealized / totalMargin * 100 : 0;
  return {symbol, notional: totalNotional, unrealized: totalUnrealized, roi, side: short ? "SHORT" : "LONG"};
}
async function calcOpenQty(symbol) {
  const minN = await minNotional(symbol);
  const mark = await markPrice(symbol);
  if (minN <= 0 || mark <= 0) throw new Error("无法获取 " + symbol + " 的最少开仓金额或标记价格");
  let qty = (minN + 1.0) / mark;
  const step = await lotStep(symbol);
  if (step > 0) qty = Math.ceil(qty / step) * step;
  const prec = await qtyPrec(symbol);
  return {qty: round(qty, prec), minNotional: minN, mark};
}
async function calcAddQty(pos) {
  let qty = Math.abs(toFloat(pos.positionAmt));
  const symbol = pos.symbol;
  const minN = await minNotional(symbol);
  let notional = Math.abs(toFloat(pos.notional));
  if (notional <= 0) notional = qty * toFloat(pos.markPrice);
  if (minN > 0 && notional < minN) {
    const mark = toFloat(pos.markPrice);
    if (mark > 0) {
      qty = (minN + 1.0) / mark;
      const step = await lotStep(symbol);
      if (step > 0) qty = Math.ceil(qty / step) * step;
    }
  }
  const prec = await qtyPrec(symbol);
  return {qty: round(qty, prec), minNotional: minN, notional};
}
function round(v, prec) { const f = Math.pow(10, prec); return Math.round(v * f) / f; }

// ==================== 开仓 / 加仓 / 平仓 ====================
// 市价单：按候选 positionSide 依次重试（覆盖双向/单向持仓模式）
async function submitMarketOrder(key, secret, symbol, qty, side, candidates, reduceOnly) {
  const prec = await qtyPrec(symbol);
  let lastErr = null;
  for (const positionSide of candidates) {
    const params = {symbol, side, type: "MARKET", quantity: qtyStr(qty, prec), positionSide};
    if (reduceOnly) params.reduceOnly = "true";
    try {
      return await bfSigned("POST", "/fapi/v1/order", params, key, secret);
    } catch (e) {
      if (e.message.indexOf("4061") >= 0 || /position side/i.test(e.message)) { lastErr = e; continue; }
      throw e;
    }
  }
  throw lastErr;
}
function qtyStr(q, prec) { return q.toFixed(prec); }
async function openPosition(key, secret, symbol, quantity, side) {
  const short = side === "SHORT";
  const wanted = short ? "SHORT" : "LONG";
  const dual = await getDualSide(key, secret);
  return submitMarketOrder(key, secret, symbol, quantity, short ? "SELL" : "BUY",
    dual ? [wanted, "BOTH"] : ["BOTH", wanted], false);
}
async function addPosition(key, secret, pos, quantity) {
  const amt = toFloat(pos.positionAmt);
  const wanted = amt > 0 ? "LONG" : "SHORT";
  const posSide = pos.positionSide || wanted;
  return submitMarketOrder(key, secret, pos.symbol, quantity, amt > 0 ? "BUY" : "SELL",
    posSide === "BOTH" ? ["BOTH", wanted] : [posSide, "BOTH"], false);
}
// 撤销止损单（签名/时间同步/-1021 重试统一走 bfRequest）
async function cancelAlgoOrder(key, secret, clientAlgoId) {
  return bfSigned("DELETE", "/fapi/v1/algoOrder", {clientAlgoId}, key, secret);
}
async function cleanupStaleSl(key, secret, accountName, openSides) {
  const orders = loadTracking();
  if (!orders.length) return 0;
  const kept = [], canceled = [];
  for (const order of orders) {
    const orderAcct = order.account || accountName(0);
    if (accountName !== orderAcct) { kept.push(order); continue; }
    const openSet = (openSides[order.symbol] || new Set());
    if (openSet.has(order.positionSide || "BOTH")) { kept.push(order); continue; }
    try {
      await cancelAlgoOrder(key, secret, order.clientAlgoId);
      canceled.push(order.symbol);
    } catch (e) { kept.push(order); } // 撤销失败先保留，下次再试
  }
  saveTracking(kept);
  return canceled.length;
}

// ==================== 获取（主流程，与桌面版同口径） ====================
async function onFetch(opts) {
  const silent = !!(opts && opts.silent); // 自动模式下的失败不弹窗，只写日志
  if (state.fetching) return false;   // 已在拉取：交给调用方决定是否等待重拉
  state.fetching = true;
  dualCache.clear(); // 每次获取重新确认持仓模式
  const btn = $("btnFetch");
  btn.disabled = true;
  btn.textContent = "获取中…";
  $("status").textContent = "正在获取各账户仓位…";
  await pingNet(); // 顺便刷新网络状态灯
  try {
    const acctIdxs = accountList();
    const results = {};
    const jobs = [];
    for (const i of acctIdxs) {
      const {key, secret, is5x} = keysFor(i);
      if (!key || !secret) { results[i] = null; continue; }
      jobs.push((async () => {
        try {
          const positions = await fetchPositions(key, secret);
          const posMap = {};
          positions.forEach(p => { (posMap[p.symbol] = posMap[p.symbol] || []).push(p); });
          const rows = {}, rowsShort = {};
          ALL_PAIRS.forEach(sym => {
            const r = computePosition(sym, posMap[sym] || []);
            r.roi = scaleRoi(is5x, r.roi);
            rows[sym] = r;
            const rs = computePosition(sym, posMap[sym] || [], "SHORT");
            rs.roi = scaleRoi(is5x, rs.roi);
            rowsShort[sym] = rs;
          });
          const openSides = {};
          positions.forEach(p => {
            if (toFloat(p.positionAmt) > 0) {
              (openSides[p.symbol] = openSides[p.symbol] || new Set())
                .add(p.positionSide || "BOTH");
            }
          });
          const cleaned = await cleanupStaleSl(key, secret, accountName(i), openSides);
          results[i] = {ok: true, rows, rowsShort, cleaned};
        } catch (e) {
          results[i] = {ok: false, error: (e && e.message) || String(e)};
        }
      })());
    }
    await Promise.all(jobs);

    // 排序（与桌面版 sort_base_order 一致）
    const baseMap = {}, baseOrder = [];
    ALL_PAIRS.forEach(sym => {
      const base = sym.slice(0, -4), suffix = sym.slice(-4);
      if (!baseMap[base]) { baseMap[base] = {}; baseOrder.push(base); }
      baseMap[base][suffix] = sym;
    });
    const rowMaps = acctIdxs.map(i => (results[i] && results[i].ok) ? results[i].rows : null);
    const sortedBases = [...baseOrder].sort((a, b) => {
      const ka = groupKey(a, baseMap, rowMaps), kb = groupKey(b, baseMap, rowMaps);
      if (ka.count !== kb.count) return kb.count - ka.count;
      if (ka.total !== kb.total) return kb.total - ka.total;
      return 0; // 稳定排序：无仓位的组保持原顺序排最后
    });
    function groupKey(base, baseMap, rowMaps) {
      const syms = ["USDT", "USDC"].map(k => baseMap[base][k]).filter(Boolean);
      let total = 0, count = 0;
      rowMaps.forEach(rm => {
        if (!rm) return;
        syms.forEach(s => {
          const r = rm[s];
          if (r && r.notional > 0) { total += r.notional; count++; }
        });
      });
      return {count, total};
    }
    const order = [];
    sortedBases.forEach(base => {
      ["USDT", "USDC"].forEach(k => { if (baseMap[base][k]) order.push(baseMap[base][k]); });
    });

    const accounts = [];
    let cleanedTotal = 0;
    acctIdxs.forEach((i, pos) => {
      const r = results[i];
      const entry = {idx: i, pos: pos + 1, name: accountName(i)};
      if (r === null || r === undefined) entry.status = "unconfigured";
      else if (!r.ok) { entry.status = "error"; entry.error = r.error; }
      else { entry.status = "ok"; entry.rows = r.rows; entry.rowsShort = r.rowsShort; cleanedTotal += r.cleaned; }
      accounts.push(entry);
    });
    state.data = {order, bases: sortedBases, accounts, cleaned_total: cleanedTotal};
    render();
    return true;
  } catch (e) {
    $("status").textContent = "获取失败：" + e.message;
    if (silent) autoLog("获取失败：" + e.message, "err", true);
    else showInfo("获取失败", String(e.message));
    return false;
  } finally {
    state.fetching = false;
    btn.disabled = false;
    btn.textContent = "获取";
  }
}

// ==================== 自动开仓（按序号顺序补位，只开仓不加仓） ====================
// 编号规则：每个币单独一串编号。以 XRP 为例：
//   账户1 XRPUSDT多=1、账户1 XRPUSDT空=2、账户1 XRPUSDC多=3、账户1 XRPUSDC空=4、
//   账户2 XRPUSDT多=5、账户2 XRPUSDT空=6、账户2 XRPUSDC多=7、账户2 XRPUSDC空=8 ……
// 其它币各自从 1 开始重新编号。账户按设置里填了密钥的账户顺序排。
const AUTO_INTERVAL = 11;          // 刷新间隔（秒）
const MAX_TRY_PER_CYCLE = 5;       // 一轮里最多尝试 5 个格子（失败/跳过就换下一条）

const auto = {
  running: false, busy: false, cd: 0, timer: null,
  latency: 0, failed: new Set(),   // failed: 开仓失败/跳过、本批次不再重试的格子
};

// 币内编号：每个账户占 4 格（USDT多、USDT空、USDC多、USDC空）
function slotToNo(acctPos, quoteIdx, short) {
  return acctPos * 4 + quoteIdx * 2 + (short ? 1 : 0) + 1;
}
function noToSlot(no, base) {
  const i = no - 1;
  const acctPos = Math.floor(i / 4), rest = i % 4;
  const quoteIdx = Math.floor(rest / 2), short = (rest % 2) === 1;
  return {no, base, acctPos, quoteIdx, short, sym: base + (quoteIdx === 0 ? "USDT" : "USDC")};
}
function slotKey(slot) { return slot.base + "#" + slot.no; }
// true=有仓 false=空仓 null=该账户数据不可用
function slotOccupied(slot) {
  const acct = state.data && state.data.accounts && state.data.accounts[slot.acctPos];
  if (!acct || acct.status !== "ok") return null;
  const r = (slot.short ? acct.rowsShort : acct.rows)[slot.sym];
  return !!(r && r.notional > 0);
}
// 符合开仓条件的交易对 = 「只看需加仓/开仓」筛选后表格里显示的那些币（同币所有账户/多空/USDT+USDC 整体判定）
// 每轮现算：某个币开了一格后新仓 ROI 回升 → 它就不再显示 → 后续轮次不会再碰
function actionKeepBases(data) {
  if (!data) return [];
  return filterBases(data).keep.filter(b => BASES.indexOf(b) >= 0);
}
// 在候选交易对里，按「币内 1..N」的顺序找第一个空仓位（失败/跳过的格子不再重试）
function scanFirstEmpty(keepBases) {
  const accts = (state.data && state.data.accounts) || [];
  const bases = keepBases || actionKeepBases(state.data);
  const total = accts.length * 4;
  for (const base of bases) {
    if (BASES.indexOf(base) < 0) continue;
    for (let no = 1; no <= total; no++) {
      const slot = noToSlot(no, base);
      if (auto.failed.has(slotKey(slot))) continue;
      if (slotOccupied(slot) === false) return slot;   // null = 未配置/获取失败，跳过
    }
  }
  return null;
}
// 日志：只保留最近 5 条（防占内存）；默认只显示「开仓成功」，其它过程信息不落日志
function autoLog(text, cls, show) {
  if (show === undefined) show = (cls === "ok");
  if (!show) return;
  const box = $("autoLog");
  const d = document.createElement("div");
  d.className = cls || "";
  const t = new Date().toLocaleTimeString("zh-CN", {hour12: false});
  d.innerHTML = "<span class='t'>" + t + "</span>" + esc(text);
  box.appendChild(d);
  while (box.children.length > 5) box.removeChild(box.firstChild);
  box.scrollTop = box.scrollHeight;
}
function setNet(ok) {
  const pill = $("netPill");
  pill.classList.toggle("ok", ok === true);
  pill.classList.toggle("bad", ok === false);
  $("netText").textContent = ok === null ? "网络检测中…"
    : ok ? ("网络正常" + (auto.latency > 0 ? " " + auto.latency + "ms" : "")) : "网络异常";
}
async function pingNet() {
  const t0 = performance.now();
  try {
    await bfPublic("/fapi/v1/ping");
    auto.latency = Math.round(performance.now() - t0);
    setNet(true);
    return true;
  } catch (e) {
    auto.latency = 0;
    setNet(false);
    return false;
  }
}
function showNextSlot(slot) {
  if (!slot) { $("slotInfo").textContent = ""; return; }
  const acct = state.data.accounts[slot.acctPos];
  $("slotInfo").textContent = "下一个待开：" + slot.base + " No." + slot.no + " " + (acct ? acct.name : "") +
    " " + slot.sym + " " + (slot.short ? "空单" : "多单");
}
// 开一个仓（市价、最小仓位，只开仓不加仓）。返回 true=真的下了单，false=跳过/失败（由调用方换下一条）
async function autoOpen(slot) {
  const acct = state.data.accounts[slot.acctPos];
  if (!acct || acct.status !== "ok") return false;
  const dir = slot.short ? "空单" : "多单";
  const {key, secret} = keysFor(acct.idx);
  if (!key || !secret) return false;
  // 单向持仓模式下，反向市价单会先把原持仓平掉，这种格子不自动开
  const opp = (slot.short ? acct.rows : acct.rowsShort)[slot.sym];
  if (opp && opp.notional > 0) {
    let dual = false;
    try { dual = await getDualSide(key, secret); } catch (e) {}
    if (!dual) {
      autoLog(slot.base + " No." + slot.no + " " + acct.name + " " + slot.sym + dir +
        " 跳过：单向持仓且已有反向仓位，市价反手会先平仓", "err", true);
      return false;
    }
  }
  const {qty, minNotional, mark} = await calcOpenQty(slot.sym);
  const res = await openPosition(key, secret, slot.sym, qty, slot.short ? "SHORT" : "LONG");
  autoLog(slot.base + " No." + slot.no + " 开仓成功：" + slot.sym + " " + dir + " " + trimNum(qty) +
    "（约 " + (qty * mark).toFixed(2) + " USDT，订单号 " + (res.orderId || "?") + "）", "ok");
  // 开完立刻重拉一次，确保后续判断用的是最新仓位
  await refreshPositions({silent: true});
  const occ = slotOccupied(slot);
  if (occ === false) {
    autoLog("复核：" + slot.base + " No." + slot.no + " 暂未显示持仓，请手动确认", "err", true);
    return false;   // 没落到仓位上，当失败处理，换下一条
  }
  return true;
}

// 一轮的开仓动作：只成功开一个；遇到异常/跳过就记录并换下一条，最多试 MAX_TRY_PER_CYCLE 次
async function openOnePerCycle() {
  let tried = 0;
  while (tried < MAX_TRY_PER_CYCLE && auto.running) {
    const keepBases = actionKeepBases(state.data);
    const slot = scanFirstEmpty(keepBases);
    showNextSlot(slot);
    if (!slot) {
      $("autoStat").textContent = "等待中：暂无可开仓的空位，每 " + AUTO_INTERVAL + " 秒刷新一次" +
        (keepBases.length ? "（当前符合条件：" + keepBases.join("、") + "）" : "");
      return;
    }
    tried++;
    $("autoStat").textContent = "运行中：" + slot.base + " No." + slot.no + " " + slot.sym +
      " " + (slot.short ? "空单" : "多单") + " 正在开仓…";
    try {
      if (await autoOpen(slot)) return;                            // 成功开一个就收手
      auto.failed.add(slotKey(slot));                              // 跳过（如单向持仓冲突）
    } catch (e) {
      auto.failed.add(slotKey(slot));
      autoLog(slot.base + " No." + slot.no + " 开仓异常，跳过下一条：" +
        ((e && e.message) || String(e)), "err", true);
      await sleep(600);                                            // 稍等，避免连续打接口
    }
  }
  if (tried >= MAX_TRY_PER_CYCLE) $("autoStat").textContent = "运行中：本轮连续失败 " + tried + " 次，下一轮再试";
}

async function autoCycle() {
  if (!auto.running || auto.busy) return;
  auto.busy = true;
  auto.cd = AUTO_INTERVAL;
  $("cdNum").textContent = auto.cd;
  try {
    // refreshPositions 内部会先 ping 一次（刷新网络灯），再拉各账户仓位
    if (!(await refreshPositions({silent: true})) || !state.data) {
      $("autoStat").textContent = "获取仓位失败，本轮跳过";
      return;
    }
    const accounts = state.data.accounts || [];
    if (!accounts.some(a => a.status === "ok")) {
      $("autoStat").textContent = "各账户仓位均获取失败，本轮跳过";
      return;
    }
    await openOnePerCycle();
    if (auto.running && $("autoStat").textContent.indexOf("正在开仓") >= 0) {
      $("autoStat").textContent = "运行中：本轮处理完，等下一轮刷新";
    }
  } catch (e) {
    autoLog("运行异常：" + ((e && e.message) || String(e)), "err", true);
    $("autoStat").textContent = "运行异常：" + ((e && e.message) || String(e));
  } finally {
    auto.busy = false;
    if (auto.running) $("cdNum").textContent = auto.cd;
  }
}

function autoTick() {
  if (!auto.running || auto.busy) return;
  auto.cd--;
  if (auto.cd <= 0) { autoCycle(); return; }
  $("cdNum").textContent = auto.cd;
}

function startAuto() {
  if (auto.running) return;
  auto.running = true;
  auto.cd = AUTO_INTERVAL;
  auto.failed = new Set();
  const btn = $("btnAuto");
  btn.textContent = "停止";
  btn.classList.remove("primary");
  btn.classList.add("danger");
  $("autoLog").classList.add("show");
  $("cdNum").textContent = auto.cd;
  setNet(null);
  $("autoStat").textContent = "运行中：每 " + AUTO_INTERVAL + " 秒刷新一次，只在表格里符合条件的交易对补空位，只开仓不加仓";
  clearInterval(auto.timer);
  auto.timer = setInterval(autoTick, 1000);
  autoCycle();  // 第一轮立刻执行
}

function stopAuto() {
  auto.running = false;
  clearInterval(auto.timer);
  auto.timer = null;
  auto.cd = 0;
  $("cdNum").textContent = "--";
  showNextSlot(null);
  const btn = $("btnAuto");
  btn.textContent = "开始";
  btn.classList.remove("danger");
  btn.classList.add("primary");
}

function askStartAuto() {
  const keepBases = state.data ? actionKeepBases(state.data) : [];
  const slot = state.data ? scanFirstEmpty(keepBases) : null;
  let body = "点击「开始」后：\n" +
    "· 每 " + AUTO_INTERVAL + " 秒自动刷新一次各账户仓位，并显示读秒与网络状态\n" +
    "· 只在「符合开仓条件」的交易对里开仓——就是表格里显示的那些币（同币所有账户/多空/USDT+USDC 整体判定），别的币一律不碰\n" +
    "· 每个币单独一串编号：账户1 的 币USDT多=1、币USDT空=2、币USDC多=3、币USDC空=4，账户2 接着 5、6、7、8……\n" +
    "· 每轮按币内 No.1 起的顺序扫这些交易对的格子，遇到第一个**没有仓位**的格子，按最小仓位（最少开仓额 +1 USDT）市价开仓\n" +
    "· 一次只开一个格子；开的时候如果报错/被跳过，自动换下一条试（一轮最多试 " + MAX_TRY_PER_CYCLE + " 个）\n" +
    "· 开完立刻重拉，这个币的新仓 ROI 回升后就不再显示，后续轮次自然不会再碰；从未显示过的币一律不碰\n" +
    "· 只开仓，不加仓、不平仓；符合条件的空位都开完后就停在「等待中」，每 11 秒继续刷新，发现有新的符合条件交易对会自动开\n" +
    "· 每格编号显示在交易对右上角\n\n";
  body += "当前符合开仓条件的交易对：" + (keepBases.length ? keepBases.join("、") : "无") + "\n";
  body += slot
    ? "第一个待开仓位：No." + slot.no + " · " + (state.data.accounts[slot.acctPos] || {}).name +
      " · " + slot.sym + " · " + (slot.short ? "空单" : "多单")
    : (state.data ? "当前没有可开仓的空位（或账户数据不可用）" : "尚未获取仓位，开始后先拉取一次再判断");
  body += "\n\n真实资金市价开仓，确认开始？";
  $("planTitle").textContent = "开始自动开仓确认";
  $("planBody").textContent = body;

}

// ==================== 计划与执行 ====================
// 规则（多单/空单同一套）：无仓→按最小仓位开仓(min+1)；有仓 ROI>100%→全平平仓；有仓 ROI<-100%→等量加仓(不足min+1)；中间不动
async function buildPlan(symbol, acctIdx, key, secret, side) {
  const short = side === "SHORT";
  const dirName = short ? "空单" : "多单";
  const {is5x} = keysFor(acctIdx);
  const allRows = await fetchPositions(key, secret, symbol);
  const rows = allRows.filter(p => short ? toFloat(p.positionAmt) < 0 : toFloat(p.positionAmt) > 0);
  const otherSide = allRows.some(p => short ? toFloat(p.positionAmt) > 0 : toFloat(p.positionAmt) < 0);
  const plan = {symbol, acctIdx, acctName: accountName(acctIdx), side: short ? "SHORT" : "LONG", otherSide};
  if (rows.length > 1) {
    return Object.assign(plan, {action: "error", message: symbol + " 存在多个" + dirName + "持仓记录，请手动处理。"});
  }
  if (!rows.length) {
    // 单向持仓模式下，反向市价单会先把原持仓平掉，这种情况直接拦住
    if (otherSide) {
      let dual = true;
      try { dual = await getDualSide(key, secret); } catch (e) {}
      if (!dual) {
        return Object.assign(plan, {action: "error", message: symbol + " 该账户为单向持仓模式且已有" + (short ? "多单" : "空单") +
          "，此时市价" + (short ? "卖出" : "买入") + "会先平掉原持仓，请切换到双向持仓模式或手动处理。"});
      }
    }
    const {qty, minNotional, mark} = await calcOpenQty(symbol);
    return Object.assign(plan, {action: "open", qty, minNotional, mark});
  }
  const pos = rows[0];
  const rawRoi = positionRoi(pos);
  const roi = scaleRoi(is5x, rawRoi);
  const posAmt = Math.abs(toFloat(pos.positionAmt));
  const mark = toFloat(pos.markPrice);

  // ROI > 100% → 全平平仓止盈
  if (roi > 100) {
    return Object.assign(plan, {action: "close", roi, pos, qty: posAmt});
  }
  // ROI < -100% → 等量加仓
  if (roi < -100) {
    const {qty, minNotional, notional} = await calcAddQty(pos);
    let detail = "（数量与当前持仓相同，仓位翻倍）";
    if (minNotional > 0 && notional < minNotional) {
      detail = "（当前仓位 " + notional.toFixed(2) + " USDT 低于最少开仓 " + minNotional.toFixed(2) +
        " USDT，按 " + (minNotional + 1).toFixed(2) + " USDT 折算数量）";
    }
    return Object.assign(plan, {action: "add", roi, qty, detail, pos});
  }
  // 中间区间不操作
  return Object.assign(plan, {action: "none", roi, pos});
}

async function closePosition(key, secret, pos) {
  const amt = toFloat(pos.positionAmt);
  const short = amt < 0;
  const wanted = short ? "SHORT" : "LONG";
  const posSide = pos.positionSide || wanted;
  return submitMarketOrder(key, secret, pos.symbol, Math.abs(amt), short ? "BUY" : "SELL",
    posSide === "BOTH" ? ["BOTH", wanted] : [posSide, "BOTH"], true);
}

async function executePlan(p, key, secret) {
  const symbol = p.symbol, acct = p.acctName;
  const short = p.side === "SHORT";
  const dirName = short ? "空单" : "多单";
  if (p.action === "open") {
    const result = await openPosition(key, secret, symbol, p.qty, p.side);
    return acct + " 开仓成功：" + symbol + " " + trimNum(p.qty) + "（" + dirName + "，约 " + (p.qty * p.mark).toFixed(2) +
      " USDT）\n订单号 " + (result.orderId || "?");
  }
  if (p.action === "close") {
    // 平仓前先撤销该交易对所有止损单
    try {
      const openAlgo = await listOpenAlgoForClose(key, secret, symbol);
      for (const o of openAlgo) { try { await cancelAlgoOrder(key, secret, o.clientAlgoId || o.algoId); } catch (e) {} }
    } catch (e) {}
    const orders = loadTracking();
    const kept = orders.filter(o => !(o.account === acct && o.symbol === symbol));
    saveTracking(kept);
    const result = await closePosition(key, secret, p.pos);
    return acct + " 平仓成功（止盈）：" + symbol + " 全平" + dirName + " " + trimNum(p.qty) +
      "\nROI " + fmtRoi(p.roi) + "\n订单号 " + (result.orderId || "?");
  }
  // add：等量加仓（空单则等量加空）
  const result = await addPosition(key, secret, p.pos, p.qty);
  const orderId = result.orderId || "?";
  return acct + " 加仓成功（补仓）：" + symbol + " " + trimNum(p.qty) +
    (short ? "（等量加空，仓位翻倍）" : "（等量加仓，仓位翻倍）") +
    "\n当前 ROI " + fmtRoi(p.roi) + "\n订单号 " + orderId;
}
async function listOpenAlgoForClose(key, secret, symbol) {
  try {
    const d = await bfSigned("GET", "/fapi/v1/algoOrder", {symbol}, key, secret);
    return Array.isArray(d) ? d : [];
  } catch (e) { return []; }
}
function trimNum(v) { return String(v).replace(/(\.\d*?[1-9])0+$/, "$1").replace(/\.0+$/, ""); }

async function onPlan(symbol, acctIdx, side) {
  const short = side === "SHORT";
  const dirName = short ? "空单" : "多单";
  const note = p => (p && p.otherSide
    ? "（注：该交易对存在" + (short ? "多单" : "空单") + "，本次只处理" + dirName + "）\n" : "");
  $("status").textContent = "正在查询 " + symbol + " " + dirName + " 最新持仓…";
  const {key, secret} = keysFor(acctIdx);
  if (!key || !secret) { showInfo("提示", accountName(acctIdx) + " 未填写密钥"); return; }
  try {
    const p = await buildPlan(symbol, acctIdx, key, secret, short ? "SHORT" : "LONG");
    if (p.action === "error") {
      showInfo("提示", p.message);
      $("status").textContent = p.message;
      return;
    }
    if (p.action === "none") {
      const msg = p.acctName + " · " + p.symbol + "（" + dirName + "）当前投资回报率 " + fmtRoi(p.roi) + "\n" +
        "规则：无仓→开仓(min+1)；ROI>100%→平仓止盈；ROI<-100%→等量加仓。\n" +
        "当前 ROI 在 -100%~100% 之间，不执行任何操作。";
      showInfo("不操作", msg);
      $("status").textContent = p.acctName + " · " + p.symbol + dirName + "：ROI " + fmtRoi(p.roi) + "，区间内不操作";
      return;
    }
    let body, title;
    if (p.action === "open") {
      title = (short ? "开空确认" : "开仓确认");
      body = "账户：" + p.acctName + "\n无" + dirName + "持仓，将以【市价单】" + (short ? "卖出开空 " : "买入开仓 ") +
        trimNum(p.qty) + " " + p.symbol + "\n" +
        "开仓金额约 " + fmtMoney(p.qty * p.mark) + " USDT（最少开仓 " + fmtMoney(p.minNotional) +
        " USDT + 1）\n" + note(p) + "\n确认执行？";
    } else if (p.action === "close") {
      title = "平仓止盈确认";
      body = "账户：" + p.acctName + "\n当前 ROI " + fmtRoi(p.roi) + " > 100%\n" +
        "将以【市价单】全平" + dirName + " " + trimNum(p.qty) + " " + p.symbol + "\n" +
        (short ? "" : "（同时撤销该交易对所有止损单）\n") + "\n确认平仓？";
    } else {
      title = "加仓补仓确认";
      body = "账户：" + p.acctName + "\n当前 ROI " + fmtRoi(p.roi) + " < -100%\n" +
        "将以【市价单】" + (short ? "卖出加空 " : "买入加仓 ") + trimNum(p.qty) + " " + p.symbol + " " + p.detail + "\n" +
        note(p) + "\n确认执行？";
    }
    $("planTitle").textContent = title;
    $("planBody").textContent = body;
    $("planMask").dataset.mode = "";
    $("planMask").dataset.plan = JSON.stringify(p);
    $("planMask").classList.add("show");
  } catch (e) {
    $("status").textContent = "查询失败：" + e.message;
    showInfo("查询失败", String(e.message));
  }
}

async function onPlanOk() {
  const mode = $("planMask").dataset.mode;
  hide($("planMask"));
  if (mode === "auto") { $("planMask").dataset.mode = ""; startAuto(); return; }
  const raw = $("planMask").dataset.plan;
  if (!raw) return;
  const p = JSON.parse(raw);
  const {key, secret} = keysFor(p.acctIdx);
  $("status").textContent = "正在执行：" + p.acctName + " · " + p.symbol + " …";
  let ok = true, msg;
  try {
    msg = await executePlan(p, key, secret);
  } catch (e) {
    ok = false;
    msg = "执行失败：" + ((e && e.message) || String(e));
  }
  $("status").textContent = (ok ? "交易已执行" : "执行失败") + "，正在拉取最新仓位…";
  const refreshed = await refreshPositions();
  $("status").textContent = ok ? "交易已执行" : "执行失败";
  showInfo(ok ? "执行成功" : "执行失败",
    msg + "\n\n" + (refreshed ? "已重新拉取最新仓位，表格为最新数据。"
                              : "自动刷新失败，请点「获取」重新拉取后再操作。"));
}

/* 保证操作后看到的一定是最新数据：
   先等上一次拉取结束（避免 onFetch 因 fetching 直接返回），再完整重拉一遍 */
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function refreshPositions(opts) {
  for (let i = 0; i < 60 && state.fetching; i++) await sleep(200);   // 最多等 12 秒
  if (state.fetching) return false;
  try {
    return await onFetch(opts) === true;
  } catch (e) {
    return false;
  }
}

/* 只看需要动作的币：同一个币的 USDT+USDC、多单+空单、所有账户视为一个整体
   没有任何仓位 → 显示（可以开最小仓）
   全部仓位 ROI ≤ -100% → 显示（等量加仓）
   只要有一个仓位 ROI > -100%（含正数、含 -99%）→ 整币隐藏 */
function filterBases(data) {
  const keep = [], drop = [];
  (data.bases || []).forEach(base => {
    let hasPos = false, allDeep = true;
    data.accounts.forEach(a => {
      if (a.status !== "ok") return;
      ["USDT", "USDC"].forEach(q => {
        const sym = base + q;
        ["LONG", "SHORT"].forEach(side => {
          const r = (side === "LONG" ? a.rows : a.rowsShort)[sym];
          if (r && r.notional > 0) {
            hasPos = true;
            if (!(isFinite(r.roi) && r.roi <= -100)) allDeep = false;
          }
        });
      });
    });
    if (!hasPos || allDeep) keep.push(base); else drop.push(base);
  });
  return {keep, drop};
}

function toggleFilter() {
  state.onlyAction = !state.onlyAction;
  $("btnFilter").textContent = state.onlyAction ? "显示全部" : "只看需加仓";
  $("groupSel").disabled = state.onlyAction;
  if (state.data) render();
  else {
    $("summary").textContent = state.onlyAction ? "只看需加仓 / 开仓（全部 " + ALL_PAIRS.length + " 对）" : "全部交易对";
  }
}

// 交易对块：账户1 的 USDT 块 → 账户1 的 USDC 块 → 账户2 的 USDT 块 → 账户2 的 USDC 块 → …
// 每个币种两行：第一行多单，紧跟下一行空单
// 每个块 = 交易对名 + 仓位 + ROI + 加仓按钮
function render() {
  const data = state.data;
  if (!data) return;
  $("emptyHint").style.display = "none";
  const head = $("headRow");
  head.innerHTML = "";
  let h = "<th class='dir-head'>方向</th>";
  data.accounts.forEach(a => {
    const k = loadKeys()[a.idx] || {};
    const fiveTag = k.is5x ? " <span class='tag' style='background:rgba(124,58,237,.2);color:#a78bfa;'>5x</span>" : "";
    h += "<th class='acct-head' colspan='8'>" + esc(a.name) + fiveTag + tagOf(a) + "</th>";
  });
  head.innerHTML = h;

  const tbody = $("gridBody");
  tbody.innerHTML = "";
  const filterInfo = state.onlyAction ? filterBases(data) : null;
  let bases;
  if (filterInfo) {
    bases = filterInfo.keep;
  } else {
    const shown = data.order.filter(s => state.groupPairs.has(s));
    const baseSet = new Set(shown.map(s => s.slice(0, -4)));
    bases = (data.bases || []).filter(b => baseSet.has(b));
  }
  $("groupSel").disabled = !!filterInfo;
  if (filterInfo && !bases.length) {
    $("emptyHint").style.display = "block";
    $("emptyHint").textContent = "当前没有需要加仓 / 开仓的币（全部仓位 ROI 都在 -100% 以内）";
  }

  bases.forEach(base => {
    ["LONG", "SHORT"].forEach(side => {
      const tr = document.createElement("tr");
      tr.className = "coin-row " + (side === "LONG" ? "stripe-0" : "stripe-1");
      let html = "<td class='dir " + (side === "LONG" ? "dir-long" : "dir-short") + "'>" +
        (side === "LONG" ? "多单" : "空单") + "</td>";
      data.accounts.forEach((a, ai) => {
        ["USDT", "USDC"].forEach(quote => {
          const sym = base + quote;
          const no = slotToNo(ai, quote === "USDT" ? 0 : 1, side === "SHORT");
          html += "<td class='sym" + (ai > 0 && quote === "USDT" ? " acct-first" : "") + "'>" + esc(sym) +
            "<span class='slotno'>" + no + "</span></td>";
          if (a.status === "ok") {
            const r = (side === "LONG" ? a.rows : a.rowsShort)[sym];
            if (r && r.notional > 0) {
              html += "<td class='num mono'>" + fmtMoney(r.notional) + "</td>";
              html += "<td class='num mono " + roiClass(r.roi) + "'>" + fmtRoi(r.roi) + "</td>";
            } else {
              html += "<td class='num'></td><td class='num'></td>";
            }
            // 多单/空单都带加仓按钮，data-side 决定方向（无仓时按最小仓位开仓）
            html += "<td class='center'>" + (state.configured[a.idx]
              ? "<button class='btn-add' data-sym='" + esc(sym) + "' data-i='" + a.idx +
                "' data-side='" + side + "'>加仓" + (a.pos || (a.idx + 1)) + "</button>"
              : "") + "</td>";
          } else if (a.status === "error") {
            // 「失败」只在该账户第一个块显示一次，避免每个块都重复
            html += "<td class='num' style='color:#f53f3f'>" +
              (side === "LONG" && quote === "USDT" ? "失败" : "") + "</td>";
            html += "<td class='num'></td><td class='center'></td>";
          } else {
            html += "<td class='num'></td><td class='num'></td><td class='center'></td>";
          }
        });
      });
      tr.innerHTML = html;
      tbody.appendChild(tr);
    });
    // 币种与币种之间留出间隔（多单/空单两行本身贴紧）
    const gap = document.createElement("tr");
    gap.className = "coin-gap";
    gap.innerHTML = "<td colspan='" + (1 + data.accounts.length * 8) + "'></td>";
    tbody.appendChild(gap);
  });
  bindAddButtons();

  const parts = [];
  data.accounts.forEach(a => {
    if (a.status === "ok") {
      let n = 0, total = 0;
      ALL_PAIRS.forEach(sym => {
        const r = a.rows[sym];
        if (r && r.notional > 0) { n++; total += r.notional; }
      });
      parts.push(a.name + ":" + n + "仓 " + (total > 0 ? fmtMoney(total) : "0.00") + "U");
    } else if (a.status === "error") {
      parts.push(a.name + " 失败");
    }
  });
  if (filterInfo) {
    $("status").textContent = "只看需加仓 / 开仓（全部 " + ALL_PAIRS.length + " 对）：显示 " + bases.length + " 个币，隐藏 " +
      filterInfo.drop.length + " 个" + (parts.length ? " | " + parts.join(" | ") : "");
    $("summary").textContent = "整表汇总 · 同币 USDT/USDC 合并判断";
  } else {
    $("status").textContent = "获取成功（" + $("groupSel").selectedOptions[0].textContent + "）：" + parts.join(" | ");
    $("summary").textContent = "已加载 " + bases.length + " 个币 / " + (bases.length * 2) + " 个交易对";
  }
  $("cleaned").textContent = data.cleaned_total ? "撤销失效止损单 " + data.cleaned_total + " 个" : "";
}
function tagOf(a) {
  if (a.status === "ok") return "<span class='tag ok'>OK</span>";
  if (a.status === "error") return "<span class='tag err'>失败</span>";
  return "<span class='tag na'>未配置</span>";
}
function bindAddButtons() {
  document.querySelectorAll("#gridBody .btn-add").forEach(btn => {
    btn.onclick = () => onPlan(btn.dataset.sym, parseInt(btn.dataset.i, 10), btn.dataset.side || "LONG");
  });
}

function buildSettings() {

    "<td></td>" +

  const rows = document.querySelectorAll("#settingsTable tr");

    tr.querySelector("td").textContent = "账户" + (i + 1);

function updateSettingsHint() {

}

function onSaveSettings() {
  const keys = {};
  let n = 0;
  document.querySelectorAll("#settingsTable tr").forEach(tr => {
    const key = tr.querySelector("input[data-f=key]").value.trim();
    const secret = tr.querySelector("input[data-f=secret]").value.trim();
    if (!key && !secret) return;   // 整行空着不占账户位
    keys[n++] = {key, secret, is5x: tr.querySelector("input[data-f=is5x]").checked};
  });
  saveKeys(keys);
  refreshConfigured();
  if (state.data) render();
  showInfo("保存成功", "已保存 " + n + " 个账户的密钥到当前浏览器（localStorage）。\n换设备/换浏览器后需要在此重新填写。");
  buildSettings();
}

async function onTest() {
  $("btnTest").disabled = true;
  $("btnTest").textContent = "测试中…";
  const lines = [];
  try {
    await bfPublic("/fapi/v1/ping");
    lines.push("① 币安公共接口：连接正常 ✓");
  } catch (e) { lines.push("① 币安公共接口失败：" + e.message); }
  for (const i of accountList()) {
    const {key, secret} = keysFor(i);
    if (!key || !secret) { lines.push("② " + accountName(i) + "：未填密钥，跳过"); continue; }
    try {
      const positions = await fetchPositions(key, secret);
      lines.push("② " + accountName(i) + " 签名持仓：OK " + positions.length + " 条 ✓");
    } catch (e) { lines.push("② " + accountName(i) + " 签名持仓失败：" + e.message); }
  }
  $("btnTest").disabled = false;
  $("btnTest").textContent = "测试连接";
  showInfo("连接测试", lines.join("\n"));
}

function init() {
  refreshConfigured();
  const sel = $("groupSel");
  sel.innerHTML = "";
  state.groups.forEach((g, i) => {
    const opt = document.createElement("option");
    opt.value = i;
    opt.textContent = g.label;
    sel.appendChild(opt);
  });
  sel.selectedIndex = 0;
  applyGroup();
  buildSettings();
  $("groupSel").disabled = state.onlyAction;
  $("btnFilter").textContent = state.onlyAction ? "显示全部" : "只看需加仓";
  $("status").textContent =
    "就绪：已加载 " + ALL_PAIRS.length + " 个交易对（" + state.groups.length + " 组可选），当前显示「" +
    state.groups[0].label + "」，点击「获取」拉取数据";
  pingNet(); // 打开页面先测一次网络
}

// ---------------- 事件绑定 ----------------
$("btnFetch").onclick = () => onFetch();
$("btnAuto").onclick = () => {
  if (auto.running) {
    stopAuto();
    $("autoStat").textContent = "已停止，点击「开始」继续";
    autoLog("手动停止自动开仓");
  } else askStartAuto();
};
$("groupSel").onchange = applyGroup;
$("btnFilter").onclick = toggleFilter;
$("btnSettings").onclick = () => { buildSettings(); $("settingsMask").classList.add("show"); };
$("btnCloseSettings").onclick = () => hide($("settingsMask"));
$("btnSave").onclick = onSaveSettings;
$("btnAddAcct").onclick = addAccountRow;
$("btnTest").onclick = onTest;
$("btnPlanCancel").onclick = () => { $("planMask").dataset.mode = ""; hide($("planMask")); $("status").textContent = "已取消"; };
$("btnPlanOk").onclick = onPlanOk;
$("btnInfoOk").onclick = () => hide($("infoMask"));

init();
</script>
</body>
