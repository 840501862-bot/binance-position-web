<script>
"use strict";

// ==================== 常量与数据 ====================
const FAPI = "https://fapi.binance.com";            // USDⓈ-M 合约
const ACCOUNT_COUNT = 6;
const ACCOUNT_NAMES = ["账户1", "账户2", "账户3", "账户4", "账户5", "账户6"];
const KEY_STORE = "bf_keys_v1";                     // localStorage 键名
const SL_STORE = "bf_sl_orders_v1";                 // 本地止损单跟踪
// 35 个基础币种（按交易对文件顺序，每组 USDT 在上、USDC 在下）
const BASES = ["NEO","ETHFI","1000BONK","ORDI","KAITO","BIO","WLFI","PNUT","BCH","BOME",
  "LTC","PENGU","CRV","TRUMP","HBAR","1000SHIB","WIF","UNI","SUI","WLD",
  "AVAX","1000PEPE","ARB","LINK","AAVE","ADA","SOL","ZEC","XRP","NEAR",
  "BNB","ENA","FIL","DOGE","TIA"];
const ALL_PAIRS = [];
BASES.forEach(b => { ALL_PAIRS.push(b + "USDT", b + "USDC"); });
const MAX_COINS_PER_GROUP = 12;

function buildPairGroups() {
  const n = Math.max(1, Math.ceil(BASES.length / MAX_COINS_PER_GROUP));
  const groups = [];
  for (let gi = 0; gi < n; gi++) {
    const chunk = BASES.slice(gi * MAX_COINS_PER_GROUP, (gi + 1) * MAX_COINS_PER_GROUP);
    const syms = [];
    chunk.forEach(b => { syms.push(b + "USDT", b + "USDC"); });
    groups.push({label: "第" + (gi + 1) + "组 " + chunk.length + "币 " + syms.length + "对", pairs: syms});
  }
  return groups;
}

// ==================== 全局状态 ====================
const state = {
  groups: buildPairGroups(),
  groupPairs: new Set(),
  data: null,
  configured: [],
  fetching: false,
};
let groupIndex = 0;
const $ = id => document.getElementById(id);

// ==================== 密钥管理（仅存本浏览器） ====================
function loadKeys() {
  try { return JSON.parse(localStorage.getItem(KEY_STORE) || "{}") || {}; }
  catch (e) { return {}; }
}
function saveKeys(keys) { localStorage.setItem(KEY_STORE, JSON.stringify(keys)); }
function keysFor(i) {
  const k = loadKeys()[i] || {};
  return {key: (k.key || "").trim(), secret: (k.secret || "").trim()};
}

// 本地止损单跟踪：{account, symbol, positionSide, clientAlgoId, triggerPrice, created}
function loadTracking() {
  try { const d = JSON.parse(localStorage.getItem(SL_STORE) || "[]"); return Array.isArray(d) ? d : []; }
  catch (e) { return []; }
}
function saveTracking(orders) { localStorage.setItem(SL_STORE, JSON.stringify(orders)); }

// ==================== 工具 ====================
function esc(s) {
  return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function toFloat(v, dflt) { const n = parseFloat(v); return isFinite(n) ? n : (dflt || 0); }
function fmtMoney(v) {
  if (v == null || !isFinite(v) || v <= 0) return "";
  return v.toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});
}
function fmtRoi(v) {
  if (v == null || !isFinite(v)) return "";
  return (v > 0 ? "+" : "") + v.toFixed(2) + "%";
}
function roiClass(v) {
  if (v == null || !isFinite(v) || v === 0) return "";
  return v > 0 ? "pos-up" : "pos-dn";
}
function showInfo(title, body) {
  $("infoTitle").textContent = title;
  $("infoBody").textContent = body;
  $("infoMask").classList.add("show");
}
function hide(el) { el.classList.remove("show"); }

// ==================== 币安客户端（浏览器直连） ====================
// 服务器时间同步（60 秒内不重复；performance.now() 做单调时钟）
let serverRefMs = 0, serverRefPerf = 0, syncOk = false;
async function ensureOffset() {
  if (syncOk && performance.now() - serverRefPerf < 60000) return;
  const urls = [FAPI + "/fapi/v1/time", "https://api.binance.com/api/v3/time"];
  for (const url of urls) {
    try {
      const r = await fetch(url, {method: "GET"});
      const d = await r.json();
      const ms = toFloat(d.serverTime);
      if (ms > 0) { serverRefMs = ms; serverRefPerf = performance.now(); syncOk = true; return; }
    } catch (e) { /* 换下一个时间源 */ }
  }
  syncOk = false; // 两个都失败：保持旧基准，下次请求前再同步
}
async function forceResync() { syncOk = false; await ensureOffset(); }
async function nowMs() {
  await ensureOffset();
  if (serverRefMs > 0) return Math.round(serverRefMs + (performance.now() - serverRefPerf));
  return Date.now();
}

// HMAC-SHA256 签名（crypto.subtle，需 https/localhost 安全上下文）
async function hexSign(secret, msg) {
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey("raw", enc.encode(secret),
    {name: "HMAC", hash: "SHA-256"}, false, ["sign"]);
  const sig = await crypto.subtle.sign("HMAC", key, enc.encode(msg));
  return Array.from(new Uint8Array(sig)).map(b => b.toString(16).padStart(2, "0")).join("");
}

// 统一请求：public 不带签名；signed 带 X-MBX-APIKEY + signature，遇 -1021 重同步重试一次
async function bfRequest(path, method, params, key, secret, retry1021) {
  if (retry1021 === undefined) retry1021 = true;
  const q = new URLSearchParams();
  if (params) { for (const [k, v] of Object.entries(params)) { if (v !== undefined && v !== null) q.append(k, v); } }
  let url = FAPI + path;
  let headers = {};
  if (key && secret) {
    q.append("timestamp", String(await nowMs()));
    q.append("recvWindow", "10000");
    const query = q.toString();
    headers["X-MBX-APIKEY"] = key;
    url = FAPI + path + "?" + query + "&signature=" + await hexSign(secret, query);
  } else if (q.toString()) {
    url = FAPI + path + "?" + q.toString();
  }
  const resp = await fetch(url, {method, headers});
  let data;
  try { data = await resp.json(); } catch (e) { data = null; }
  if (resp.status !== 200) {
    if (data && data.code === -1021 && retry1021) {
      await forceResync();
      return bfRequest(path, method, params, key, secret, false);
    }
    const msg = (data && data.code !== undefined)
      ? "code " + data.code + "：" + (data.msg || "无错误说明（HTTP " + resp.status + "）")
      : "HTTP " + resp.status;
    throw new Error(path + " 失败：" + msg);
  }
  if (data && typeof data === "object" && data.code !== undefined && data.code !== null
      && String(data.code) !== "200") {
    if (data.code === -1021 && retry1021) {
      await forceResync();
      return bfRequest(path, method, params, key, secret, false);
    }
    throw new Error(path + " 失败（code " + data.code + "）：" + (data.msg || "无说明"));
  }
  return data;
}
const bfPublic = (path, params) => bfRequest(path, "GET", params, null, null, false);
const bfSigned = (method, path, params, key, secret) => bfRequest(path, method, params, key, secret);

// ==================== 交易规则（exchangeInfo 缓存） ====================
let exInfo = null, exFilters = null;
async function ensureEx() {
  if (exInfo) return;
  const data = await bfPublic("/fapi/v1/exchangeInfo");
  exInfo = {};
  exFilters = {};
  (data.symbols || []).forEach(s => {
    exInfo[s.symbol] = [toFloat(s.quantityPrecision, 4), toFloat(s.pricePrecision, 4)];
    let minNotional = 0, step = 0;
    (s.filters || []).forEach(f => {
      if (f.filterType === "MIN_NOTIONAL") minNotional = toFloat(f.notional);
      else if (f.filterType === "LOT_SIZE") step = toFloat(f.stepSize);
    });
    exFilters[s.symbol] = {minNotional, stepSize: step};
  });
}
const qtyPrec = async s => { await ensureEx(); return (exInfo[s] || [4, 4])[0]; };
const pricePrec = async s => { await ensureEx(); return (exInfo[s] || [4, 4])[1]; };
const minNotional = async s => { await ensureEx(); return (exFilters[s] || {}).minNotional || 0; };
const lotStep = async s => { await ensureEx(); return (exFilters[s] || {}).stepSize || 0; };
async function markPrice(symbol) {
  const d = await bfPublic("/fapi/v1/premiumIndex", {symbol});
  return toFloat(d.markPrice);
}

// ==================== 持仓与计算（与桌面版一致） ====================
async function fetchPositions(key, secret, symbol) {
  return bfSigned("GET", "/fapi/v2/positionRisk", symbol ? {symbol} : {}, key, secret);
}
const dualCache = new Map(); // api_key -> 是否双向持仓
async function getDualSide(key, secret) {
  if (!dualCache.has(key)) {
    const d = await bfSigned("GET", "/fapi/v2/account", {}, key, secret);
    dualCache.set(key, !!d.dualSidePosition);
  }
  return dualCache.get(key);
}
function positionMargin(pos) {
  const margin = toFloat(pos.positionInitialMargin || pos.isolatedMargin || pos.initialMargin);
  if (margin > 0) return margin;
  const notional = Math.abs(toFloat(pos.notional));
  const lev = toFloat(pos.leverage);
  if (lev > 0 && notional > 0) return notional / lev;
  return 0;
}
function positionRoi(pos) {
  const unrealized = toFloat(pos.unRealizedProfit);
  const margin = positionMargin(pos);
  if (margin <= 0) return 0;
  return unrealized / margin * 100;
}
// 只统计多单：positionAmt>0 的行合并成一行
function computePosition(symbol, rows) {
  let totalNotional = 0, totalUnrealized = 0, totalMargin = 0;
  (rows || []).forEach(pos => {
    const amt = toFloat(pos.positionAmt);
    if (amt <= 0) return;
    const mark = toFloat(pos.markPrice);
    totalNotional += amt * mark;
    totalUnrealized += toFloat(pos.unRealizedProfit);
    totalMargin += positionMargin(pos);
  });
  const roi = totalMargin > 0 ? totalUnrealized / totalMargin * 100 : 0;
  return {symbol, notional: totalNotional, unrealized: totalUnrealized, roi};
}
async function calcOpenQty(symbol) {
  const minN = await minNotional(symbol);
  const mark = await markPrice(symbol);
  if (minN <= 0 || mark <= 0) throw new Error("无法获取 " + symbol + " 的最少开仓金额或标记价格");
  let qty = (minN + 1.0) / mark;
  const step = await lotStep(symbol);
  if (step > 0) qty = Math.ceil(qty / step) * step;
  const prec = await qtyPrec(symbol);
  return {qty: round(qty, prec), minNotional: minN, mark};
}
async function calcAddQty(pos) {
  let qty = Math.abs(toFloat(pos.positionAmt));
  const symbol = pos.symbol;
  const minN = await minNotional(symbol);
  let notional = Math.abs(toFloat(pos.notional));
  if (notional <= 0) notional = qty * toFloat(pos.markPrice);
  if (minN > 0 && notional < minN) {
    const mark = toFloat(pos.markPrice);
    if (mark > 0) {
      qty = (minN + 1.0) / mark;
      const step = await lotStep(symbol);
      if (step > 0) qty = Math.ceil(qty / step) * step;
    }
  }
  const prec = await qtyPrec(symbol);
  return {qty: round(qty, prec), minNotional: minN, notional};
}
function round(v, prec) { const f = Math.pow(10, prec); return Math.round(v * f) / f; }
function calcStopPrice(pos) {
  const amt = toFloat(pos.positionAmt);
  const entry = toFloat(pos.entryPrice);
  const unrealized = toFloat(pos.unRealizedProfit);
  if (unrealized <= 0) throw new Error("当前没有浮盈（未实现盈亏≤0），无法设置浮盈50%止损");
  if (amt === 0 || entry <= 0) throw new Error("持仓数量或开仓价为 0，无法设置止损");
  const half = unrealized / 2, qty = Math.abs(amt);
  return amt > 0 ? entry + half / qty : entry - half / qty;
}
function calcAddSlEstimate(pos, mark, addQty) {
  const amt = toFloat(pos.positionAmt);
  const entry = toFloat(pos.entryPrice);
  const unrealized = toFloat(pos.unRealizedProfit);
  if (unrealized <= 0) throw new Error("当前没有浮盈（未实现盈亏≤0），无法设置浮盈50%止损");
  const qty = Math.abs(amt);
  if (qty <= 0 || addQty <= 0) throw new Error("持仓数量或加仓数量为 0，无法计算止损");
  const newQty = qty + addQty;
  const avgEntry = (entry * qty + mark * addQty) / newQty;
  const half = unrealized / 2;
  return amt > 0 ? avgEntry + half / newQty : avgEntry - half / newQty;
}

// ==================== 开仓 / 加仓 / 止损 ====================
async function openPosition(key, secret, symbol, quantity) {
  const prec = await qtyPrec(symbol);
  const dual = await getDualSide(key, secret);
  const candidates = dual ? ["LONG", "BOTH"] : ["BOTH", "LONG"];
  let lastErr = null;
  for (const positionSide of candidates) {
    try {
      return await bfSigned("POST", "/fapi/v1/order", {
        symbol, side: "BUY", type: "MARKET",
        quantity: qtyStr(quantity, prec), positionSide,
      }, key, secret);
    } catch (e) {
      if (e.message.indexOf("4061") >= 0 || /position side/i.test(e.message)) { lastErr = e; continue; }
      throw e;
    }
  }
  throw lastErr;
}
function qtyStr(q, prec) { return q.toFixed(prec); }
async function addPosition(key, secret, pos, quantity) {
  const symbol = pos.symbol;
  const amt = toFloat(pos.positionAmt);
  const prec = await qtyPrec(symbol);
  const side = amt > 0 ? "BUY" : "SELL";
  const posSide = pos.positionSide || (amt > 0 ? "LONG" : "SHORT");
  const candidates = posSide === "BOTH" ? ["BOTH", amt > 0 ? "LONG" : "SHORT"] : [posSide, "BOTH"];
  let lastErr = null;
  for (const positionSide of candidates) {
    try {
      return await bfSigned("POST", "/fapi/v1/order", {
        symbol, side, type: "MARKET", quantity: qtyStr(quantity, prec), positionSide,
      }, key, secret);
    } catch (e) {
      if (e.message.indexOf("4061") >= 0 || /position side/i.test(e.message)) { lastErr = e; continue; }
      throw e;
    }
  }
  throw lastErr;
}
function newClientAlgoId() {
  // 币安要求 32 位字母数字：SL + 30 位随机 hex
  const hex = Array.from(crypto.getRandomValues(new Uint8Array(15)))
    .map(b => b.toString(16).padStart(2, "0")).join("");
  return ("SL" + hex).toUpperCase().slice(0, 32);
}
async function cancelAlgoOrder(key, secret, clientAlgoId) {
  const params = {clientAlgoId};
  const q = new URLSearchParams();
  q.append("clientAlgoId", clientAlgoId);
  q.append("timestamp", String(await nowMs()));
  q.append("recvWindow", "10000");
  const query = q.toString();
  const sig = await hexSign(secret, query);
  const resp = await fetch(FAPI + "/fapi/v1/algoOrder?" + query + "&signature=" + sig,
    {method: "DELETE", headers: {"X-MBX-APIKEY": key}});
  let data;
  try { data = await resp.json(); } catch (e) { data = null; }
  if (resp.status !== 200) {
    if (data && data.code === -1021) {
      await forceResync();
      const q2 = new URLSearchParams();
      q2.append("clientAlgoId", clientAlgoId);
      q2.append("timestamp", String(await nowMs()));
      q2.append("recvWindow", "10000");
      const query2 = q2.toString();
      const sig2 = await hexSign(secret, query2);
      const resp2 = await fetch(FAPI + "/fapi/v1/algoOrder?" + query2 + "&signature=" + sig2,
        {method: "DELETE", headers: {"X-MBX-APIKEY": key}});
      try { data = await resp2.json(); } catch (e) { data = null; }
      if (resp2.status === 200) return data;
      throw new Error("撤销止损单失败（code -1021）：时间偏差过大，已重试仍失败");
    }
    throw new Error("撤销止损单失败：" + ((data && data.code !== undefined)
      ? "code " + data.code + "：" + (data.msg || "") : "HTTP " + resp.status));
  }
  return data;
}
async function placeStopLoss(key, secret, pos) {
  const symbol = pos.symbol;
  const amt = toFloat(pos.positionAmt);
  const entry = toFloat(pos.entryPrice);
  const unrealized = toFloat(pos.unRealizedProfit);
  if (unrealized <= 0) throw new Error("当前没有浮盈（未实现盈亏≤0），无法设置浮盈50%止损");
  if (amt === 0) throw new Error("持仓数量为 0，无法设置止损");
  const half = unrealized / 2, qty = Math.abs(amt);
  const side = amt > 0 ? "SELL" : "BUY";
  const prec = await pricePrec(symbol);
  const stopPrice = round(entry + (amt > 0 ? half / qty : -half / qty), prec);
  const posSide = pos.positionSide || (amt > 0 ? "LONG" : "SHORT");
  const candidates = posSide === "BOTH" ? ["BOTH", amt > 0 ? "LONG" : "SHORT"] : [posSide, "BOTH"];
  let lastErr = null;
  for (const positionSide of candidates) {
    const clientAlgoId = newClientAlgoId();
    const algoParams = {
      algoType: "CONDITIONAL", symbol, side, type: "STOP_MARKET",
      triggerPrice: stopPrice.toFixed(prec), closePosition: "true",
      positionSide, clientAlgoId,
    };
    try {
      const data = await bfSigned("POST", "/fapi/v1/algoOrder", algoParams, key, secret);
      return {stopPrice, data, clientAlgoId};
    } catch (e) {
      if (e.message.indexOf("4061") >= 0 || /position side/i.test(e.message)) { lastErr = e; continue; }
      throw new Error("止损单提交失败：" + e.message);
    }
  }
  throw lastErr;
}
async function cleanupStaleSl(key, secret, accountName, openSides) {
  const orders = loadTracking();
  if (!orders.length) return 0;
  const kept = [], canceled = [];
  for (const order of orders) {
    const orderAcct = order.account || ACCOUNT_NAMES[0];
    if (accountName !== orderAcct) { kept.push(order); continue; }
    const openSet = (openSides[order.symbol] || new Set());
    if (openSet.has(order.positionSide || "BOTH")) { kept.push(order); continue; }
    try {
      await cancelAlgoOrder(key, secret, order.clientAlgoId);
      canceled.push(order.symbol);
    } catch (e) { kept.push(order); } // 撤销失败先保留，下次再试
  }
  saveTracking(kept);
  return canceled.length;
}

// ==================== 获取（主流程，与桌面版同口径） ====================
async function onFetch() {
  if (state.fetching) return;
  state.fetching = true;
  const btn = $("btnFetch");
  btn.disabled = true;
  btn.textContent = "获取中…";
  $("status").textContent = "正在获取各账户仓位…";
  try {
    const results = new Array(ACCOUNT_COUNT);
    const jobs = [];
    for (let i = 0; i < ACCOUNT_COUNT; i++) {
      const {key, secret} = keysFor(i);
      if (!key || !secret) { results[i] = null; continue; }
      jobs.push((async () => {
        try {
          const positions = await fetchPositions(key, secret);
          const posMap = {};
          positions.forEach(p => { (posMap[p.symbol] = posMap[p.symbol] || []).push(p); });
          const rows = {};
          ALL_PAIRS.forEach(sym => { rows[sym] = computePosition(sym, posMap[sym] || []); });
          const openSides = {};
          positions.forEach(p => {
            if (toFloat(p.positionAmt) > 0) {
              (openSides[p.symbol] = openSides[p.symbol] || new Set())
                .add(p.positionSide || "BOTH");
            }
          });
          const cleaned = await cleanupStaleSl(key, secret, ACCOUNT_NAMES[i], openSides);
          results[i] = {ok: true, rows, cleaned};
        } catch (e) {
          results[i] = {ok: false, error: (e && e.message) || String(e)};
        }
      })());
    }
    await Promise.all(jobs);

    // 排序（与桌面版 sort_base_order 一致）
    const baseMap = {}, baseOrder = [];
    ALL_PAIRS.forEach(sym => {
      const base = sym.slice(0, -4), suffix = sym.slice(-4);
      if (!baseMap[base]) { baseMap[base] = {}; baseOrder.push(base); }
      baseMap[base][suffix] = sym;
    });
    const rowMaps = results.map(r => (r && r.ok) ? r.rows : null);
    const sortedBases = [...baseOrder].sort((a, b) => {
      const ka = groupKey(a, baseMap, rowMaps), kb = groupKey(b, baseMap, rowMaps);
      if (ka.count !== kb.count) return kb.count - ka.count;
      if (ka.total !== kb.total) return kb.total - ka.total;
      return 0; // 稳定排序：无仓位的组保持原顺序排最后
    });
    function groupKey(base, baseMap, rowMaps) {
      const syms = ["USDT", "USDC"].map(k => baseMap[base][k]).filter(Boolean);
      let total = 0, count = 0;
      rowMaps.forEach(rm => {
        if (!rm) return;
        syms.forEach(s => {
          const r = rm[s];
          if (r && r.notional > 0) { total += r.notional; count++; }
        });
      });
      return {count, total};
    }
    const order = [];
    sortedBases.forEach(base => {
      ["USDT", "USDC"].forEach(k => { if (baseMap[base][k]) order.push(baseMap[base][k]); });
    });

    const accounts = [];
    let cleanedTotal = 0;
    for (let i = 0; i < ACCOUNT_COUNT; i++) {
      const r = results[i];
      const entry = {idx: i, name: ACCOUNT_NAMES[i]};
      if (r === null) entry.status = "unconfigured";
      else if (!r.ok) { entry.status = "error"; entry.error = r.error; }
      else { entry.status = "ok"; entry.rows = r.rows; cleanedTotal += r.cleaned; }
      accounts.push(entry);
    }
    state.data = {order, accounts, cleaned_total: cleanedTotal};
    render();
  } catch (e) {
    $("status").textContent = "获取失败：" + e.message;
    showInfo("获取失败", String(e.message));
  } finally {
    state.fetching = false;
    btn.disabled = false;
    btn.textContent = "获取";
  }
}

// ==================== 计划与执行 ====================
async function buildPlan(symbol, acctIdx, key, secret) {
  const roiLo = acctIdx === 0 ? -100.0 : -7.5;
  const roiHi = acctIdx === 0 ? 100.0 : 7.5;
  const allRows = await fetchPositions(key, secret, symbol);
  const rows = allRows.filter(p => toFloat(p.positionAmt) > 0);
  const hasShort = allRows.some(p => toFloat(p.positionAmt) < 0);
  const plan = {symbol, acctIdx, acctName: ACCOUNT_NAMES[acctIdx]};
  if (rows.length > 1) {
    return Object.assign(plan, {action: "error", message: symbol + " 存在多个多单持仓记录，请手动处理。"});
  }
  if (!rows.length) {
    const {qty, minNotional, mark} = await calcOpenQty(symbol);
    return Object.assign(plan, {action: "open", qty, minNotional, mark, hasShort});
  }
  const pos = rows[0];
  const roi = positionRoi(pos);
  const {qty, minNotional, notional} = await calcAddQty(pos);
  let detail = "（数量与当前持仓相同，仓位翻倍）";
  if (minNotional > 0 && notional < minNotional) {
    detail = "（当前仓位金额 " + notional.toFixed(2) + " USDT 低于最少开仓 " + minNotional.toFixed(2) +
      " USDT，按 " + (minNotional + 1).toFixed(2) + " USDT 折算数量）";
  }
  const p = Object.assign(plan, {action: "none", roi, roiLo, roiHi, verb: "买入加多", qty, detail, pos, hasShort});
  if (roi <= roiLo) p.action = "add";
  else if (roi > roiHi) {
    p.action = "add_sl";
    p.stopPrice = calcAddSlEstimate(pos, toFloat(pos.markPrice), qty);
  }
  return p;
}

async function executePlan(p, key, secret) {
  const symbol = p.symbol, acct = p.acctName;
  if (p.action === "open") {
    const result = await openPosition(key, secret, symbol, p.qty);
    return acct + " 开仓成功：" + symbol + " " + trimNum(p.qty) + "（约 " + (p.qty * p.mark).toFixed(2) +
      " USDT）\n订单号 " + (result.orderId || "?");
  }
  const result = await addPosition(key, secret, p.pos, p.qty);
  const orderId = result.orderId || "?";
  if (p.action === "add") {
    return acct + " 加仓成功：" + symbol + " " + trimNum(p.qty) + "（" + p.verb + "，仓位翻倍）\n订单号 " + orderId;
  }
  // add_sl：先撤旧止损再挂新止损
  const fresh = (await fetchPositions(key, secret, symbol)).filter(x => toFloat(x.positionAmt) > 0);
  if (!fresh.length) throw new Error("加仓成功，但未查询到该账户的多单持仓，无法设置止损单（请手动检查仓位）");
  const freshPos = fresh[0];
  const freshSide = freshPos.positionSide || (toFloat(freshPos.positionAmt) > 0 ? "LONG" : "SHORT");
  // 撤销该账户该交易对该方向的旧止损单
  const orders = loadTracking();
  const kept = [];
  for (const o of orders) {
    if (o.account === acct && o.symbol === symbol && (o.positionSide || "BOTH") === freshSide) {
      try { await cancelAlgoOrder(key, secret, o.clientAlgoId); } catch (e) { kept.push(o); }
      continue;
    }
    kept.push(o);
  }
  saveTracking(kept);
  await new Promise(r => setTimeout(r, 300)); // 等撤销生效
  const {stopPrice, clientAlgoId} = await placeStopLoss(key, secret, freshPos);
  const tracking = loadTracking();
  tracking.push({account: acct, symbol, positionSide: freshSide, clientAlgoId,
    triggerPrice: stopPrice, created: new Date().toLocaleString("zh-CN", {hour12: false})});
  saveTracking(tracking);
  return acct + " 加仓成功：" + symbol + " " + trimNum(p.qty) + "（仓位翻倍）\n订单号 " + orderId +
    "\n\n止损单已设置：触发时剩余浮盈 = 加仓后当前浮盈的 50%（全仓平仓），触发价 " + stopPrice;
}
function trimNum(v) { return String(v).replace(/(\.\d*?[1-9])0+$/, "$1").replace(/\.0+$/, ""); }

async function onPlan(symbol, acctIdx) {
  $("status").textContent = "正在查询 " + symbol + " 最新持仓与加仓条件…";
  const {key, secret} = keysFor(acctIdx);
  if (!key || !secret) { showInfo("提示", ACCOUNT_NAMES[acctIdx] + " 未填写密钥"); return; }
  try {
    const p = await buildPlan(symbol, acctIdx, key, secret);
    if (p.action === "error") {
      showInfo("提示", p.message);
      $("status").textContent = p.message;
      return;
    }
    if (p.action === "none") {
      const msg = p.acctName + " · " + p.symbol + " 当前投资回报率 " + fmtRoi(p.roi) + "\n" +
        "规则：无多单→开多；ROI≤" + p.roiLo + "%→等量加仓；ROI>" + p.roiHi + "%→等量加仓并设浮盈50%止损。\n" +
        "当前 ROI 在 " + p.roiLo + "%~" + p.roiHi + "% 之间，不执行任何操作。";
      showInfo("不满足加仓条件", msg);
      $("status").textContent = p.acctName + " · " + p.symbol + "：ROI " + fmtRoi(p.roi) + "，不满足加仓条件";
      return;
    }
    let body, title;
    if (p.action === "open") {
      title = "开仓确认";
      body = "账户：" + p.acctName + "\n将以【市价单】买入开仓 " + trimNum(p.qty) + " " + p.symbol + "\n" +
        "开仓金额约 " + fmtMoney(p.qty * p.mark) + " USDT（系统最少开仓 " + fmtMoney(p.minNotional) +
        " USDT + 1）\n" + (p.hasShort ? "（注：该交易对存在空单，工具已忽略空单，本次为开多单）\n" : "") + "\n确认执行？";
    } else {
      title = "加仓确认";
      body = "账户：" + p.acctName + "\n将以【市价单】买入加仓 " + trimNum(p.qty) + " " + p.symbol + " " + p.detail + "\n" +
        "当前投资回报率 " + fmtRoi(p.roi) + "（" + p.roiLo + "% ~ " + p.roiHi + "% 阈值）\n" +
        (p.action === "add_sl"
          ? "加仓后将设置【浮盈50%】仓位级止损（全仓平仓），预估触发价 " + fmtPrice(p.stopPrice) + "\n"
          : "") +
        (p.hasShort ? "（注：该交易对存在空单，工具已忽略空单）\n" : "") + "\n确认执行？";
    }
    $("planTitle").textContent = title;
    $("planBody").textContent = body;
    $("planMask").dataset.plan = JSON.stringify(p);
    $("planMask").classList.add("show");
  } catch (e) {
    $("status").textContent = "查询失败：" + e.message;
    showInfo("查询失败", String(e.message));
  }
}
function fmtPrice(v) { return String(v == null ? "" : v); }

async function onPlanOk() {

function render() {
  const data = state.data;
  if (!data) return;
  $("emptyHint").style.display = "none";
  const head = $("headRow");
  head.innerHTML = "";
  let h = th("交易对", "sym");
  data.accounts.forEach(a => {
    h += th("", "center", "sep");
    h += "<th class='acct-head'>" + esc(a.name) + tagOf(a) + "</th>";
    h += th(a.name + "仓位", "num");
    h += th(a.name + "ROI", "num");
    h += th("", "center");
  });
  head.innerHTML = h;

  const tbody = $("gridBody");
  tbody.innerHTML = "";
  const shown = data.order.filter(s => state.groupPairs.has(s));
  const totalCols = 1 + data.accounts.length * 4;
  let lastBase = null, groupNo = 0;
  shown.forEach(sym => {
    const base = sym.slice(0, -4);
    if (lastBase !== null && base !== lastBase) {
      const gap = document.createElement("tr");
      gap.className = "coin-gap";
      gap.innerHTML = "<td colspan='" + totalCols + "'></td>";
      tbody.appendChild(gap);
      groupNo++;
    }
    lastBase = base;
    const tr = document.createElement("tr");
    tr.className = (groupNo % 2 === 0) ? "stripe-0" : "stripe-1";
    let html = "<td class='sym'>" + esc(sym) + "</td>";
    data.accounts.forEach(a => {
      html += "<td class='sep'></td>";
      if (a.status === "ok") {
        const r = a.rows[sym];
        if (r && r.notional > 0) {
          html += "<td class='num mono'>" + fmtMoney(r.notional) + "</td>";
          html += "<td class='num mono " + roiClass(r.roi) + "'>" + fmtRoi(r.roi) + "</td>";
        } else {
          html += "<td class='num'></td><td class='num'></td>";
        }
        const cfg = state.configured[a.idx];
        html += "<td class='center'>" + (cfg
          ? "<button class='btn-add' data-sym='" + esc(sym) + "' data-i='" + a.idx + "'>加仓" + (a.idx + 1) + "</button>"
          : "") + "</td>";
      } else if (a.status === "error") {
        html += "<td class='num' style='color:#f53f3f'>失败</td><td class='num'></td><td class='center'></td>";
      } else {
        html += "<td class='num'></td><td class='num'></td><td class='center'></td>";
      }
    });
    tr.innerHTML = html;
    tbody.appendChild(tr);
  });
  bindAddButtons();

  const parts = [];
  data.accounts.forEach(a => {
    if (a.status === "ok") {
      let n = 0, total = 0;
      state.groupPairs.forEach(sym => {
        const r = a.rows[sym];
        if (r && r.notional > 0) { n++; total += r.notional; }
      });
      parts.push(a.name + ":" + n + "仓 " + (total > 0 ? fmtMoney(total) : "0.00") + "U");
    } else if (a.status === "error") {
      parts.push(a.name + " 失败");
    }
  });
  $("status").textContent = "获取成功（" + $("groupSel").selectedOptions[0].textContent + "）：" + parts.join(" | ");
  $("summary").textContent = "已加载 " + shown.length + " 个交易对";
  $("cleaned").textContent = data.cleaned_total ? "撤销失效止损单 " + data.cleaned_total + " 个" : "";
}
function th(text, cls, extra) {
  if (extra === "sep") return "<th class='sep' style='padding:0;width:2px;'></th>";
  return "<th class='" + (cls || "") + "'>" + esc(text) + "</th>";
}
function tagOf(a) {
  if (a.status === "ok") return "<span class='tag ok'>OK</span>";
  if (a.status === "error") return "<span class='tag err'>失败</span>";
  return "<span class='tag na'>未配置</span>";
}

  showInfo("连接测试", lines.join("\n"));
}

function init() {
  state.configured = [];
  for (let i = 0; i < ACCOUNT_COUNT; i++) {
    const k = keysFor(i);
    state.configured.push(!!(k.key && k.secret));
  }
  const sel = $("groupSel");
  sel.innerHTML = "";
  state.groups.forEach((g, i) => {
    const opt = document.createElement("option");
    opt.value = i;
    opt.textContent = g.label;
    sel.appendChild(opt);
  });
  sel.selectedIndex = 0;
  groupIndex = 0;
  applyGroup();
  buildSettings();
  $("status").textContent =
    "就绪：已加载 " + ALL_PAIRS.length + " 个交易对（" + state.groups.length + " 组可选），当前显示「" +
    state.groups[0].label + "」，点击「获取」拉取数据";
}

// ---------------- 事件绑定 ----------------
$("btnFetch").onclick = onFetch;
$("groupSel").onchange = applyGroup;
$("btnSettings").onclick = () => { buildSettings(); $("settingsMask").classList.add("show"); };
$("btnCloseSettings").onclick = () => hide($("settingsMask"));
$("btnSave").onclick = onSaveSettings;
$("btnTest").onclick = onTest;
$("btnPlanCancel").onclick = () => { hide($("planMask")); $("status").textContent = "已取消"; };
$("btnPlanOk").onclick = onPlanOk;
$("btnInfoOk").onclick = () => hide($("infoMask"));

init();
</script>
</body>
</html>
