<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>币安主流币仓位信息 · 网页版</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Microsoft YaHei UI", "PingFang SC", "Segoe UI", sans-serif;
    font-size: 13px; color: #d5dee8; background: #0c1e3e;
    min-height: 100vh; display: flex; flex-direction: column;
  }
  .mono { font-variant-numeric: tabular-nums; font-family: Consolas, "Microsoft YaHei UI", monospace; }

  header {
    background: linear-gradient(180deg, #0e1a2c, #0a1322);
    border-bottom: 1px solid #20334d;
    padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  header h1 { font-size: 16px; font-weight: 600; color: #eaf2ff; letter-spacing: .5px; margin-right: auto; }
  header .sub { color: #5f7d9e; font-size: 12px; }

  .toolbar {
    background: #0a1322; border-bottom: 1px solid #20334d;
    padding: 8px 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .toolbar label { color: #7d93ab; }
  select, input[type=text], input[type=password] {
    border: 1px solid #2b4a6e; border-radius: 4px; padding: 5px 8px;
    font-size: 13px; background: #0e1b33; color: #d5dee8; outline: none;
  }
  select:focus, input:focus { border-color: #2f8cff; box-shadow: 0 0 0 2px rgba(47,140,255,.15); }
  button {
    border: 1px solid #2a4d7f; border-radius: 4px; padding: 5px 14px;
    background: #142543; color: #9cc3ff; cursor: pointer; font-size: 13px;
  }
  button:hover { border-color: #2f8cff; color: #cfe3ff; }
  button:disabled { opacity: .55; cursor: not-allowed; }
  button.primary {
    background: linear-gradient(180deg, #1e7bff, #1460e0); border-color: #2f8cff;
    color: #fff; box-shadow: 0 0 10px rgba(30,123,255,.35);
  }
  button.primary:hover { background: linear-gradient(180deg, #2f8cff, #1e6ef0); color: #fff; }
  button.danger { background: #d92b45; border-color: #ff4d6d; color: #fff; }
  button.danger:hover { background: #f03650; color: #fff; }

  main { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
  .table-wrap { flex: 1; overflow: auto; position: relative; background: #0c1e3e; }
  table { border-collapse: collapse; width: 100%; min-width: 1750px; }
  thead th {
    position: sticky; top: 0; z-index: 2;
    background: #1a3a6e; border-bottom: 1px solid #2c5aa8;
    padding: 7px 6px; font-weight: 600; white-space: nowrap; color: #8fa8c4;
  }
  thead th.acct-head { text-align: center; color: #c9ddf5; }
  thead th.acct-head .tag { display: inline-block; font-size: 11px; font-weight: 400;
    border-radius: 3px; padding: 0 5px; margin-left: 4px; }
  .tag.ok { background: rgba(61,220,151,.15); color: #3ddc97; }
  .tag.err { background: rgba(255,84,112,.16); color: #ff5470; }
  .tag.na  { background: rgba(125,147,171,.15); color: #7d93ab; }
  tbody td { border-bottom: 1px solid #2E6FBF; padding: 8px 6px; white-space: nowrap; }
  tbody tr.stripe-0 { background: #3A7BD5; }
  tbody tr.stripe-1 { background: #4B8EDD; }
  tbody tr:hover { background: #5B9BE0; }
  /* 不同币种之间的空行分隔（与桌面版一致） */
  tbody tr.coin-gap td { background: #0c1e3e; height: 18px; padding: 0; border: none; }
  tbody tr.coin-gap:hover td { background: #0c1e3e; }
  td.sym { font-weight: 600; color: #ffffff; padding-left: 10px; background: #1b4fa0; }
  thead th.sym { background: #1b4fa0; color: #ffffff; border-bottom: 1px solid #2c5aa8; }
  td.num, th.num { text-align: right; color: #c3d1e2; }
  td.center, th.center { text-align: center; }
  td.sep { background: #3A7BD5; padding: 0; width: 2px !important; }
  td .btn-add {
    min-width: 58px; padding: 2px 10px; font-size: 12px; background: #16335f;
    border-color: #2a5ca0; color: #6fb0ff;
  }
  td .btn-add:hover { background: #1a4d8f; color: #fff; }
  .pos-up { color: #ff5470; font-weight: 600; }
  .pos-dn { color: #3ddc97; font-weight: 600; }
  .empty { text-align: center; padding: 40px 0; color: #5f7d9e; }

  footer {
    background: #0a1322; border-top: 1px solid #20334d;
    padding: 7px 16px; font-size: 12px; color: #7d93ab;
    display: flex; gap: 18px; flex-wrap: wrap; align-items: baseline;
  }
  footer .summary { color: #c9ddf5; }
  #status { color: #4dc3ff; }

  /* 弹窗 */
  .mask {
    position: fixed; inset: 0; background: rgba(3, 6, 12, .7);
    display: none; align-items: center; justify-content: center; z-index: 50;
  }
  .mask.show { display: flex; }
  .modal {
    background: #0f1a30; border: 1px solid #27405f; border-radius: 8px;
    width: min(640px, 92vw); max-height: 86vh; overflow: auto;
    box-shadow: 0 8px 32px rgba(0,0,0,.6);
  }
  .modal h3 { padding: 14px 18px; border-bottom: 1px solid #20334d; font-size: 15px; color: #eaf2ff; }
  .modal .body { padding: 14px 18px; font-size: 13px; line-height: 1.8; white-space: pre-wrap; color: #d5dee8; }
  .modal .foot { padding: 12px 18px; border-top: 1px solid #20334d;
    display: flex; justify-content: flex-end; gap: 10px; }
  .modal table.settings { width: 100%; border-collapse: collapse; min-width: 0; }
  .modal table.settings td { padding: 5px 6px; border-bottom: none; }
  .modal table.settings td:first-child { width: 56px; font-weight: 600; white-space: nowrap; color: #c9ddf5; }
  .modal table.settings input { width: 100%; }
  .hint { color: #5f7d9e; font-size: 12px; margin-top: 10px; }
  #testResult { white-space: pre-wrap; font-family: Consolas, monospace; font-size: 12px; }
</style>
</head>
<body>

<header>
  <h1>币安主流币仓位信息 <span class="sub">网页版 · 6 账户 · 只统计多单</span></h1>
  <button id="btnSettings">设置</button>
</header>

<div class="toolbar">
  <label for="groupSel">币对分组</label>
  <select id="groupSel"></select>
  <button id="btnFetch" class="primary">获取</button>
  <span id="status">就绪：正在加载配置…</span>
</div>

<main>
  <div class="table-wrap" id="tableWrap">
    <table id="grid">
      <thead><tr id="headRow"></tr></thead>
      <tbody id="gridBody"></tbody>
    </table>
    <div class="empty" id="emptyHint">点击「获取」拉取各账户仓位</div>
  </div>
</main>

<footer>
  <span class="summary" id="summary"></span>
  <span id="cleaned"></span>
</footer>

<!-- 设置弹窗 -->
<div class="mask" id="settingsMask">
  <div class="modal">
    <h3>设置 · 账户密钥</h3>
    <div class="body">
      <table class="settings" id="settingsTable"></table>
      <div class="hint">API 密钥保存到电脑端 config.json，下次启动自动读取。其他设备在同一局域网内访问本服务时，也可在这里填写保存。</div>
    </div>
    <div class="foot">
      <button id="btnTest">测试连接</button>
      <button id="btnSave">保存设置</button>
      <button id="btnCloseSettings">关闭</button>
    </div>
  </div>
</div>

<!-- 计划确认弹窗 -->
<div class="mask" id="planMask">
  <div class="modal">
    <h3 id="planTitle">执行确认</h3>
    <div class="body" id="planBody"></div>
    <div class="foot">
      <button id="btnPlanCancel">取消</button>
      <button id="btnPlanOk" class="danger">确认执行</button>
    </div>
  </div>
</div>

<!-- 结果弹窗 -->
<div class="mask" id="infoMask">
  <div class="modal">
    <h3 id="infoTitle">提示</h3>
    <div class="body" id="infoBody"></div>
    <div class="foot"><button id="btnInfoOk">知道了</button></div>
  </div>
</div>

<script>
"use strict";

// ---------------- 全局状态 ----------------
const state = {
  groups: [],            // [{label, pairs}]
  groupPairs: new Set(), // 当前分组包含的交易对
  data: null,            // 最近一次 /api/fetch 的结果
  configured: [],        // 每账户是否已配置密钥（决定加仓按钮是否可用）
  fetching: false,
};
const $ = id => document.getElementById(id);
let groupIndex = 0;

// API 服务地址：从 GitHub Pages 打开时默认指向本机后端（127.0.0.1:8765）；
// 从本机或局域网直接打开服务（如 http://192.168.x.x:8765）时自动用当前地址，
// 这样其他设备在同一局域网内也能填写密钥、查看仓位。
function defaultApiBase() {
  const h = location.hostname || "";
  if (location.protocol === "http:" &&
      (h === "127.0.0.1" || h === "localhost" || h.startsWith("192.168.") ||
       h.startsWith("10.") || /^172\.(1[6-9]|2\d|3[01])\./.test(h))) {
    return location.origin;
  }
  return "http://127.0.0.1:8765";
}
let apiBase = (localStorage.getItem("apiBase") || defaultApiBase()).replace(/\/+$/, "");

// ---------------- 工具 ----------------
function fmtMoney(v) {
  if (v == null || !isFinite(v) || v <= 0) return "";
  return v.toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});
}
function fmtRoi(v) {
  if (v == null || !isFinite(v)) return "";
  return (v > 0 ? "+" : "") + v.toFixed(2) + "%";
}
function roiClass(v) {
  if (v == null || !isFinite(v) || v === 0) return "";
  return v > 0 ? "pos-up" : "pos-dn";
}
async function api(method, url, body) {
  const opts = {method, headers: {}};
  if (body !== undefined) {
    opts.headers["Content-Type"] = "application/json";
    opts.body = JSON.stringify(body);
  }
  const resp = await fetch(apiBase + url, opts);
  let data;
  try { data = await resp.json(); } catch (e) { data = {}; }
  if (!resp.ok || data.ok === false) {
    throw new Error(data.error || ("HTTP " + resp.status));
  }
  return data;
}
function showInfo(title, body) {
  $("infoTitle").textContent = title;
  $("infoBody").textContent = body;
  $("infoMask").classList.add("show");
}
function hide(el) { el.classList.remove("show"); }

// ---------------- 页面初始化 ----------------
async function init() {
  try {
    const st = await api("GET", "/api/state");
    state.groups = st.groups;
    // 分组下拉（只列分组，不列全部，避免 70 对一起渲染）
    const sel = $("groupSel");
    sel.innerHTML = "";
    st.groups.forEach((g, i) => {
      const opt = document.createElement("option");
      opt.value = i;
      opt.textContent = g.label;
      sel.appendChild(opt);
    });
    sel.selectedIndex = 0;
    groupIndex = 0;
    applyGroup();
    // 设置弹窗填充
    buildSettings(st);
    // 记录哪些账户已配置密钥（决定加仓按钮是否可用；密钥只在电脑端 config.json 配置）
    state.configured = st.accounts.map(a => !!a.configured);
    $("status").textContent =
      "就绪：已加载 " + st.all_pairs.length + " 个交易对（" + st.groups.length +
      " 组可选），当前显示「" + st.groups[0].label + "」，点击「获取」拉取数据";
  } catch (e) {
    showInfo("加载失败", String(e));
  }
}

function buildSettings(st) {
  const tbody = $("settingsTable");
  tbody.innerHTML = "";
  st.accounts.forEach((a, i) => {
    const tr = document.createElement("tr");
    tr.innerHTML =
      "<td>" + esc(a.name) + "</td>" +
      "<td><input type='text' placeholder='API Key' data-i='" + i +
        "' data-f='key' value='" + esc(a.api_key || "") + "'></td>" +
      "<td style='width:14px;'></td>" +
      "<td><input type='password' placeholder='API Secret' data-i='" + i +
        "' data-f='secret' value='" + esc(a.api_secret || "") + "'></td>";
    tbody.appendChild(tr);
  });
}
function esc(s) {
  return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function applyGroup() {
  const sel = $("groupSel");
  groupIndex = parseInt(sel.value, 10) || 0;
  const g = state.groups[groupIndex];
  state.groupPairs = new Set(g ? g.pairs : []);
  if (state.data) {
    render();               // 已有数据，直接按新分组重绘，无需重新请求
  } else {
    $("summary").textContent = "当前分组：" + g.label + "（" + g.pairs.length + " 对）";
  }
}

// ---------------- 获取 ----------------
async function onFetch() {
  if (state.fetching) return;
  state.fetching = true;
  const btn = $("btnFetch");
  btn.disabled = true;
  btn.textContent = "获取中…";
  $("status").textContent = "正在获取各账户仓位…";
  try {
    const data = await api("POST", "/api/fetch");
    state.data = data;
    render();
  } catch (e) {
    $("status").textContent = "获取失败：" + e.message;
    showInfo("获取失败", String(e.message));
  } finally {
    state.fetching = false;
    btn.disabled = false;
    btn.textContent = "获取";
  }
}

// ---------------- 表格渲染 ----------------
function render() {
  const data = state.data;
  if (!data) return;
  $("emptyHint").style.display = "none";

  // 表头
  const head = $("headRow");
  head.innerHTML = "";
  let h = th("交易对", "sym");
  data.accounts.forEach(a => {
    h += th("", "center", "sep");
    h += "<th class='acct-head'>" + esc(a.name) + tagOf(a) + "</th>";
    h += th(a.name + "仓位", "num");
    h += th(a.name + "ROI", "num");
    h += th("", "center");
  });
  head.innerHTML = h;

  // 表体：只渲染当前分组内的交易对，不同币种之间用空行隔开（与桌面版一致）
  const tbody = $("gridBody");
  tbody.innerHTML = "";
  const shown = data.order.filter(s => state.groupPairs.has(s));
  const totalCols = 1 + data.accounts.length * 4;  // 交易对 + 每账户(分隔+仓位+ROI+加仓)
  let lastBase = null, groupNo = 0;
  shown.forEach((sym) => {
    const base = (sym.endsWith("USDT") || sym.endsWith("USDC")) ? sym.slice(0, -4) : sym;
    if (lastBase !== null && base !== lastBase) {
      const gap = document.createElement("tr");
      gap.className = "coin-gap";
      gap.innerHTML = "<td colspan='" + totalCols + "'></td>";
      tbody.appendChild(gap);
      groupNo++;
    }
    lastBase = base;
    // 同一币种的 USDT/USDC 两行使用同一底色；不同币种之间交替（配合空行分隔）
    const tr = document.createElement("tr");
    tr.className = (groupNo % 2 === 0) ? "stripe-0" : "stripe-1";
    let html = "<td class='sym'>" + esc(sym) + "</td>";
    data.accounts.forEach(a => {
      html += "<td class='sep'></td>";
      if (a.status === "ok") {
        const r = a.rows[sym];
        if (r && r.notional > 0) {
          html += "<td class='num mono'>" + fmtMoney(r.notional) + "</td>";
          html += "<td class='num mono " + roiClass(r.roi) + "'>" + fmtRoi(r.roi) + "</td>";
        } else {
          html += "<td class='num'></td><td class='num'></td>";
        }
        const cfg = state.configured[a.idx];
        html += "<td class='center'>" +
          (cfg
            ? "<button class='btn-add' data-sym='" + esc(sym) + "' data-i='" + a.idx + "'>加仓" + (a.idx + 1) + "</button>"
            : "") +
          "</td>";
      } else if (a.status === "error") {
        html += "<td class='num' style='color:#f53f3f'>失败</td><td class='num'></td><td class='center'></td>";
      } else {
        html += "<td class='num'></td><td class='num'></td><td class='center'></td>";
      }
    });
    tr.innerHTML = html;
    tbody.appendChild(tr);
  });
  bindAddButtons();

  // 底部汇总
  let parts = [];
  data.accounts.forEach(a => {
    if (a.status === "ok") {
      let n = 0, total = 0;
      for (const sym of state.groupPairs) {
        const r = a.rows[sym];
        if (r && r.notional > 0) { n++; total += r.notional; }
      }
      parts.push(a.name + ":" + n + "仓 " + (total > 0 ? fmtMoney(total) : "0.00") + "U");
    } else if (a.status === "error") {
      parts.push(a.name + " 失败");
    }
  });
  let status = "获取成功（" + $("groupSel").selectedOptions[0].textContent + "）：" + parts.join(" | ");
  $("status").textContent = status;
  $("summary").textContent = "已加载 " + shown.length + " 个交易对";
  $("cleaned").textContent = data.cleaned_total ? "撤销失效止损单 " + data.cleaned_total + " 个" : "";
}
function th(text, cls, extra) {
  if (extra === "sep") return "<th class='sep' style='padding:0;width:2px;'></th>";
  return "<th class='" + (cls || "") + "'>" + esc(text) + "</th>";
}
function tagOf(a) {
  if (a.status === "ok") return "<span class='tag ok'>OK</span>";
  if (a.status === "error") return "<span class='tag err'>失败</span>";
  return "<span class='tag na'>未配置</span>";
}
function bindAddButtons() {
  document.querySelectorAll("#gridBody .btn-add").forEach(btn => {
    btn.onclick = () => onPlan(btn.dataset.sym, parseInt(btn.dataset.i, 10));
  });
}

// ---------------- 加仓计划与执行 ----------------
async function onPlan(symbol, acctIdx) {
  $("status").textContent = "正在查询 " + symbol + " 最新持仓与加仓条件…";
  try {
    const res = await api("POST", "/api/plan", {symbol, acct_idx: acctIdx});
    const p = res.plan;
    if (p.action === "error") {
      showInfo("提示", p.message);
      $("status").textContent = p.message;
      return;
    }
    if (p.action === "none") {
      const msg =
        p.acct_name + " · " + p.symbol + " 当前投资回报率 " + fmtRoi(p.roi) + "\n" +
        "规则：无多单→开多；ROI≤" + p.roi_lo + "%→等量加仓；ROI>" + p.roi_hi + "%→等量加仓并设浮盈50%止损。\n" +
        "当前 ROI 在 " + p.roi_lo + "%~" + p.roi_hi + "% 之间，不执行任何操作。";
      showInfo("不满足加仓条件", msg);
      $("status").textContent = p.acct_name + " · " + p.symbol + "：ROI " + fmtRoi(p.roi) + "，不满足加仓条件";
      return;
    }
    // open / add / add_sl：弹确认框
    let body, title;
    if (p.action === "open") {
      title = "开仓确认";
      body =
        "账户：" + p.acct_name + "\n" +
        "将以【市价单】买入开仓 " + p.qty + " " + p.symbol + "\n" +
        "开仓金额约 " + fmtMoney(p.qty * p.mark) + " USDT（系统最少开仓 " +
        fmtMoney(p.min_notional) + " USDT + 1）\n" +
        (p.has_short ? "（注：该交易对存在空单，工具已忽略空单，本次为开多单）\n" : "") +
        "\n确认执行？";
    } else {
      title = "加仓确认";
      body =
        "账户：" + p.acct_name + "\n" +
        "将以【市价单】" + p.verb + " " + p.qty + " " + p.symbol + "\n" +
        p.detail + "\n";
      if (p.action === "add_sl") {
        body += "加仓后自动设置「仓位止盈止损」：止损触发时剩余浮盈 = 加仓后当前浮盈的 50%" +
          "（触发价约 " + p.stop_price + "，成交后按实际仓位重算）\n";
      }
      body += "\n确认执行？";
    }
    $("planTitle").textContent = title;
    $("planBody").textContent = body;
    window.__plan = p;
    $("planMask").classList.add("show");
  } catch (e) {
    $("status").textContent = "查询失败：" + e.message;
    showInfo("查询失败", String(e.message));
  }
}

async function onPlanOk() {
  const p = window.__plan;
  if (!p) return;
  hide($("planMask"));
  $("status").textContent = "正在执行：" + p.acct_name + " · " + p.symbol + " …";
  try {
    const res = await api("POST", "/api/execute", {plan: p});
    $("status").textContent = "交易已执行";
    showInfo("执行成功", res.message);
    setTimeout(onFetch, 1200);   // 自动刷新表格
  } catch (e) {
    $("status").textContent = "执行失败：" + e.message;
    showInfo("执行失败", String(e.message));
  }
}

// ---------------- 设置 ----------------
async function onSaveSettings() {
  const accounts = [];
  document.querySelectorAll("#settingsTable tr").forEach(tr => {
    const idx = parseInt(tr.querySelector("input[data-f=key]").dataset.i, 10);
    accounts[idx] = {
      api_key: tr.querySelector("input[data-f=key]").value,
      api_secret: tr.querySelector("input[data-f=secret]").value,
    };
  });
  try {
    const res = await api("POST", "/api/config", {accounts});
    $("status").textContent = res.message;
    const st = await api("GET", "/api/state");
    state.configured = st.accounts.map(a => !!a.configured);
    if (state.data) render();
    showInfo("保存成功", res.message);
  } catch (e) {
    showInfo("保存失败", String(e.message));
  }
}

async function onTest() {
  $("btnTest").disabled = true;
  $("btnTest").textContent = "测试中…";
  try {
    const res = await api("POST", "/api/test");
    showInfo("连接测试：" + res.summary, res.lines.join("\n"));
  } catch (e) {
    showInfo("连接测试失败", String(e.message));
  } finally {
    $("btnTest").disabled = false;
    $("btnTest").textContent = "测试连接";
  }
}

// ---------------- 事件绑定 ----------------
$("btnFetch").onclick = onFetch;
$("groupSel").onchange = applyGroup;
$("btnSettings").onclick = async () => {
  try {
    const st = await api("GET", "/api/state");
    buildSettings(st);
    state.configured = st.accounts.map(a => !!a.configured);
  } catch (e) { /* 用旧数据 */ }
  $("settingsMask").classList.add("show");
};
$("btnCloseSettings").onclick = () => hide($("settingsMask"));
$("btnSave").onclick = onSaveSettings;
$("btnTest").onclick = onTest;
$("btnPlanCancel").onclick = () => { hide($("planMask")); $("status").textContent = "已取消"; };
$("btnPlanOk").onclick = onPlanOk;
$("btnInfoOk").onclick = () => hide($("infoMask"));

init();
</script>
</body>
</html>
